<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    /* Nihongo-Learn · 主题管理器（共享）
     * 三页统一引入（<head> 内同步执行，避免首屏闪烁）。
     * 用法：NihongoTheme.init() 初始化；NihongoTheme.apply(id) 切换；
     *       NihongoTheme.updateSwitcher() 同步面板选中态（渲染后调用）。
     * 持久化：localStorage "nihongo-learn-theme"（全站共享，三页一致）。
     */
    (function () {
      "use strict";

      var THEME_KEY = "nihongo-learn-theme";
      var DEFAULT_THEME = "aka";
      var THEMES = ["aka", "sumi", "koke", "kon", "fuji"];
      var THEME_LABELS = {
        aka: "印谱・朱红",
        sumi: "墨流・墨青",
        koke: "苔庭・苔绿",
        kon: "蓝染・绀蓝",
        fuji: "藤棚・藤紫"
      };

      function current() {
        try {
          var value = window.localStorage.getItem(THEME_KEY);
          return THEMES.indexOf(value) >= 0 ? value : DEFAULT_THEME;
        } catch (error) {
          return DEFAULT_THEME;
        }
      }

      function apply(themeId) {
        var id = THEMES.indexOf(themeId) >= 0 ? themeId : DEFAULT_THEME;
        document.documentElement.setAttribute("data-theme", id);
        try {
          window.localStorage.setItem(THEME_KEY, id);
        } catch (error) {
          /* 隐私模式等场景静默降级 */
        }
        return id;
      }

      function updateSwitcher() {
        var active = current();
        var options = document.querySelectorAll(".theme-option[data-theme-id]");
        for (var i = 0; i < options.length; i += 1) {
          options[i].setAttribute("aria-pressed", String(options[i].getAttribute("data-theme-id") === active));
        }
        var buttons = document.querySelectorAll(".theme-switcher-button");
        for (var j = 0; j < buttons.length; j += 1) {
          buttons[j].setAttribute("aria-label", "切换主题配色，当前：" + (THEME_LABELS[active] || active));
        }
      }

      function init() {
        apply(current());
      }

      window.NihongoTheme = {
        apply: apply,
        current: current,
        updateSwitcher: updateSwitcher,
        init: init,
        themes: THEMES,
        labels: THEME_LABELS
      };
    })();

  </script>
  <meta name="color-scheme" content="light">
  <title>日语动词变形表 · 印谱方格</title>
  <style>
    /* 主题变量已外置至 css/themes.css（NihongoTheme 驱动） */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 91% 2%, rgba(var(--vermilion-rgb), .12), transparent 18rem),
        radial-gradient(circle at 3% 94%, rgba(var(--accent-rgb), .06), transparent 22rem),
        repeating-linear-gradient(0deg, rgba(var(--vermilion-deep-rgb), .018) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(90deg, transparent 0 23px, rgba(var(--accent-rgb), .014) 24px 25px, transparent 26px 49px),
        var(--paper);
      font-size: 15px;
      line-height: 1.55;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        repeating-radial-gradient(circle at 0 100%, transparent 0 17px, rgba(var(--vermilion-rgb), .045) 18px 19px, transparent 20px 36px),
        linear-gradient(135deg, transparent 0 47%, rgba(var(--vermilion-rgb), .025) 48% 49%, transparent 50% 100%);
      background-size: 72px 42px, 100% 100%;
      opacity: .45;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--vermilion);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page {
      width: min(1450px, 100%);
      margin: 0 auto;
      padding: 26px clamp(12px, 3vw, 42px) 58px;
    }

    .page-heading {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      border: 3px solid var(--line-strong);
      border-radius: 0;
      background:
        linear-gradient(120deg, rgba(var(--vermilion-rgb), .09), transparent 55%),
        repeating-linear-gradient(135deg, transparent 0 18px, rgba(var(--accent-rgb), .02) 19px 20px, transparent 21px 38px),
        var(--surface);
      box-shadow: var(--shadow-small), inset 0 0 0 1px var(--line);
      overflow: hidden;
    }

    .page-heading::before {
      position: absolute;
      top: -4.4rem;
      right: 5%;
      width: 11rem;
      height: 8rem;
      border: 1px solid rgba(var(--vermilion-rgb), .22);
      border-radius: 50%;
      content: "";
      transform: rotate(-9deg);
    }

    .page-heading::after {
      position: absolute;
      right: 18px;
      bottom: 9px;
      left: 20px;
      height: 3px;
      border-radius: 50%;
      background: linear-gradient(90deg, var(--vermilion), var(--accent-muted), transparent 84%);
      content: "";
      transform-origin: left center;
      animation: ink-sweep .85s cubic-bezier(.2, .8, .25, 1) both;
    }

    .page-heading > * {
      position: relative;
      z-index: 1;
    }

    .page-heading h1 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: clamp(1.55rem, 3vw, 2.55rem);
      letter-spacing: -.04em;
      line-height: 1.12;
      text-shadow: 1px 1px 0 rgba(var(--accent-rgb), .08);
    }

    .page-heading p {
      max-width: 780px;
      margin: 7px 0 0;
      color: var(--muted);
    }

    .page-heading-mark {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      flex: 0 0 auto;
      border: 3px double var(--vermilion);
      border-radius: 2px;
      color: var(--vermilion-deep);
      background:
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(var(--vermilion-rgb), .04) 9px 10px),
        var(--wash);
      box-shadow: 5px 5px 0 rgba(var(--vermilion-deep-rgb), .1);
      font-family: var(--display);
      font-size: 1.9rem;
      font-weight: 900;
      transform: rotate(2deg);
      animation: seal-arrive .7s cubic-bezier(.18, .8, .2, 1) both;
    }

    #app-shell {
      position: relative;
      display: grid;
      gap: 20px;
      margin-top: 22px;
      padding: clamp(15px, 2.7vw, 30px);
      border: 3px solid var(--line-strong);
      border-radius: 0;
      background:
        radial-gradient(circle at 100% 0, rgba(var(--vermilion-rgb), .08) 0 8rem, transparent 8.2rem),
        repeating-linear-gradient(135deg, transparent 0 25px, rgba(var(--vermilion-rgb), .016) 26px 27px, transparent 28px 54px),
        var(--surface);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
      isolation: isolate;
    }

    #app-shell::before {
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, var(--vermilion-deep), var(--vermilion), var(--accent-muted), var(--vermilion));
      background-size: 220% 100%;
      content: "";
      animation: ink-flow 9s linear infinite;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-top: 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-link {
      color: inherit;
      text-decoration: none;
    }

    .brand-link:hover .brand-seal {
      transform: translateY(-1px) rotate(-1.5deg);
    }

    .brand-seal {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 3px double var(--vermilion);
      border-radius: 2px;
      color: var(--surface-strong);
      background: var(--vermilion);
      box-shadow: 4px 4px 0 rgba(var(--vermilion-deep-rgb), .14);
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 900;
      transform: rotate(-1.5deg);
    }

    .brand h2 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .84rem;
    }

    .edition-note {
      color: var(--accent-muted);
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .main-tabs {
      display: flex;
      gap: 7px;
      padding: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background:
        repeating-linear-gradient(135deg, transparent 0 15px, rgba(var(--vermilion-rgb), .02) 16px 17px, transparent 18px 32px),
        var(--wash);
    }

    .main-tab {
      min-width: 125px;
      padding: 10px 15px;
      border: 2px solid transparent;
      border-radius: 2px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 900;
      transition: border-color .25s ease, background-color .25s ease, color .25s ease, transform .25s ease, box-shadow .25s ease;
    }

    .main-tab:hover {
      border-color: var(--line-strong);
      color: var(--vermilion-deep);
      background: var(--surface-strong);
      transform: translateY(-1px);
    }

    .main-tab[aria-selected="true"] {
      border: 3px double var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      box-shadow: 4px 4px 0 rgba(var(--vermilion-deep-rgb), .1);
      transform: rotate(-.25deg);
      animation: tab-press .42s cubic-bezier(.18, .8, .2, 1) both;
    }

    .panel {
      display: grid;
      gap: 18px;
      min-width: 0;
      animation: panel-enter .42s ease both;
    }

    .panel-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--vermilion-deep);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .panel-intro h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(1.35rem, 2.3vw, 1.95rem);
      line-height: 1.16;
    }

    .panel-intro p {
      max-width: 760px;
      margin: 7px 0 0;
      color: var(--muted);
    }

    .intro-note {
      max-width: 260px;
      padding: 10px 12px;
      border: 2px solid var(--line-strong);
      box-shadow: inset 0 0 0 1px var(--line);
      color: var(--muted);
      background: var(--wash);
      font-size: .8rem;
    }

    .conjugation-tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .055), transparent 55%),
        var(--surface-strong);
    }

    .derived-filter {
      display: grid;
      grid-template-columns: minmax(122px, auto) minmax(0, 1fr);
      align-items: center;
      gap: 10px 14px;
      margin: 12px 0 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--vermilion);
      background: var(--wash);
    }

    .derived-filter-label {
      display: grid;
      gap: 2px;
    }

    .derived-filter-label strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .86rem;
    }

    .derived-filter-label span {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.3;
    }

    .conjugation-tab {
      display: grid;
      flex: 1 1 0;
      gap: 1px;
      min-width: 0;
      padding: 10px 13px;
      border: 2px solid transparent;
      border-radius: 2px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: border-color .25s ease, background-color .25s ease, color .25s ease, transform .25s ease, box-shadow .25s ease;
    }

    .conjugation-tab:hover {
      border-color: var(--line-strong);
      color: var(--vermilion-deep);
      background: var(--wash-hover);
      transform: translateY(-1px);
    }

    .conjugation-tab[aria-selected="true"] {
      border: 3px double var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      box-shadow: 4px 4px 0 rgba(var(--vermilion-deep-rgb), .1);
      transform: rotate(-.25deg);
      animation: tab-press .42s cubic-bezier(.18, .8, .2, 1) both;
    }

    .conjugation-tab strong {
      font-family: var(--display);
      font-size: .92rem;
    }

    .conjugation-tab small {
      color: currentColor;
      font-size: .74rem;
      opacity: .76;
    }

    .rules-layout {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .group-body {
      width: 100%;
      min-width: 0;
      animation: panel-enter .45s ease both;
    }

    /* P1：先展示可记忆的变化轴与代表词路径，完整表格退到查询层 */
    .memory-overview {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 2px solid var(--vermilion);
      border-radius: 2px;
      background:
        linear-gradient(120deg, rgba(var(--vermilion-rgb), .08), transparent 58%),
        var(--surface-strong);
      box-shadow: 6px 7px 0 rgba(var(--vermilion-deep-rgb), .08);
    }

    .memory-overview-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .memory-overview-head h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(1.22rem, 2vw, 1.55rem);
      line-height: 1.2;
    }

    .memory-overview-head p {
      max-width: 740px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    .memory-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex: 0 0 auto;
    }

    .memory-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--wash);
      font-size: .7rem;
      font-weight: 800;
    }

    .memory-legend-item::before {
      width: 9px;
      height: 9px;
      border: 1px solid currentColor;
      background: currentColor;
      content: "";
    }

    .memory-legend-item.is-root {
      color: var(--ink);
    }

    .memory-legend-item.is-change {
      color: var(--vermilion-deep);
    }

    .memory-legend-item.is-suffix {
      color: var(--success);
    }

    .memory-legend-item.is-exception {
      color: var(--danger);
    }

    .memory-overview-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .memory-card {
      display: grid;
      align-content: start;
      gap: 11px;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
    }

    .memory-card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .memory-card-kicker {
      display: block;
      margin-bottom: 3px;
      color: var(--vermilion-deep);
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .memory-card h4 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.08rem;
    }

    .memory-card-badge {
      flex: 0 0 auto;
      padding: 4px 7px;
      border: 1px solid var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      font-size: .68rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .memory-axis-scroll {
      max-width: 100%;
      overflow-x: auto;
      scrollbar-color: var(--vermilion) var(--vermilion-soft);
    }

    .memory-axis {
      display: grid;
      grid-template-columns: repeat(5, minmax(92px, 1fr));
      min-width: 500px;
      border: 1px solid var(--line-strong);
      background: var(--surface-strong);
    }

    .memory-axis-column {
      display: grid;
      align-content: start;
      gap: 5px;
      min-height: 146px;
      padding: 9px 7px;
      text-align: center;
    }

    .memory-axis-column + .memory-axis-column {
      border-left: 1px solid var(--line);
    }

    .memory-axis-label {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.02rem;
      font-weight: 900;
    }

    .memory-axis-term {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
    }

    .memory-axis-sample {
      display: inline-flex;
      justify-content: center;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.22rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .memory-axis-formula {
      margin-top: auto;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .memory-card-note {
      display: grid;
      gap: 3px;
      padding: 8px 9px;
      border-left: 3px solid var(--vermilion);
      background: var(--wash);
    }

    .memory-card-note-label {
      color: var(--vermilion-deep);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .memory-card-note strong {
      color: var(--ink);
      font-family: var(--display);
      font-size: .88rem;
    }

    .memory-card-note small {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.4;
    }

    .memory-path-source {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 8px 9px;
      border: 1px dashed var(--line-strong);
      background: var(--wash);
    }

    .memory-path-source span {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
    }

    .memory-path-source strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: .05em;
    }

    .memory-path-list {
      display: grid;
      border: 1px solid var(--line);
      background: var(--surface-strong);
    }

    .memory-path-row {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) minmax(116px, .8fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 7px 9px;
    }

    .memory-path-row + .memory-path-row {
      border-top: 1px solid var(--line);
    }

    .memory-path-label {
      color: var(--vermilion-deep);
      font-size: .76rem;
      font-weight: 900;
    }

    .memory-equation {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .03em;
    }

    .memory-token {
      display: inline-block;
    }

    .memory-token.is-root {
      color: var(--ink);
    }

    .memory-token.is-change {
      padding: 1px 3px;
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      box-shadow: inset 0 -2px 0 var(--vermilion);
    }

    .memory-token.is-suffix {
      margin-left: 2px;
      padding: 1px 4px;
      color: var(--success);
      background: var(--success-soft);
      font-family: var(--sans);
      font-size: .8rem;
      letter-spacing: 0;
    }

    .memory-path-formula {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .memory-type-memory {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid var(--line-strong);
      background: var(--wash);
    }

    .memory-type-memory-head {
      display: flex;
      align-items: baseline;
      gap: 9px;
    }

    .memory-type-memory-head strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .98rem;
    }

    .memory-type-memory-head span {
      color: var(--muted);
      font-size: .72rem;
    }

    .memory-type-item.memory-type-tab {
      display: grid;
      width: 100%;
      margin: 0;
      color: inherit;
      font-family: var(--sans);
      text-align: left;
      cursor: pointer;
    }

    .memory-type-item.memory-type-tab:hover {
      border-color: var(--vermilion);
      background: var(--wash-hover);
      transform: translateY(-1px);
    }

    .memory-type-item.memory-type-tab[aria-selected="true"] {
      border-color: var(--vermilion);
      background: var(--vermilion-soft);
      box-shadow: inset 0 -3px 0 var(--vermilion), 3px 3px 0 rgba(var(--vermilion-deep-rgb), .08);
      transform: translateY(-1px);
    }

    .memory-type-detail-panel {
      display: grid;
      gap: 11px;
      padding: 13px;
      border: 2px solid var(--vermilion);
      background: var(--surface);
    }

    .memory-type-detail-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
    }

    .memory-type-detail-head h4 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.16rem;
    }

    .memory-type-detail-head p {
      max-width: 760px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.45;
    }

    .memory-type-detail-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      font-size: .7rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .memory-type-detail-note {
      padding: 8px 9px;
      border-left: 3px solid var(--accent-muted);
      color: var(--muted);
      background: var(--wash);
      font-size: .74rem;
      line-height: 1.45;
    }

    .memory-equation-join {
      padding: 0 3px;
      color: var(--accent-muted);
      font-family: var(--sans);
      font-size: .76rem;
    }

    .memory-equation-result {
      margin-left: 7px;
      padding: 1px 4px;
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      font-family: var(--display);
      font-size: .82rem;
    }

    .sound-note {
      display: grid;
      gap: 8px;
      padding: 12px 16px 14px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--accent-muted);
      background: var(--surface);
    }

    .sound-note h3 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1rem;
    }

    .sound-note p {
      margin: 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.45;
    }

    .sound-note-example {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px 8px;
      padding: 8px 9px;
      border-left: 3px solid var(--accent-muted);
      color: var(--ink);
      background: var(--wash);
      font-family: var(--display);
      font-size: .9rem;
      font-weight: 900;
    }

    .sound-note-example span {
      color: var(--muted);
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 700;
    }

    .memory-type-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .memory-type-item {
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .memory-type-item strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .8rem;
      line-height: 1.35;
    }

    .memory-type-item span {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.35;
    }

    .memory-type-item .memory-type-detail {
      color: var(--vermilion-deep);
      font-weight: 800;
    }

    .memory-type-item .memory-type-example {
      color: var(--ink);
      font-family: var(--display);
      font-weight: 800;
    }

    .memory-type-item .memory-type-focus {
      padding-top: 4px;
      border-top: 1px dashed var(--line);
      font-size: .66rem;
    }

    .derived-memory {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--accent-muted);
      background: var(--wash);
    }

    .derived-memory-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .derived-memory-head h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.2rem;
    }

    .derived-memory-head p {
      max-width: 760px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .derived-memory-head-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--accent-muted);
      color: var(--accent-muted);
      background: var(--surface);
      font-size: .7rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .derived-memory-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .derived-memory-group {
      display: grid;
      align-content: start;
      gap: 8px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .derived-memory-group-head {
      display: grid;
      gap: 3px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .derived-memory-group-head strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
    }

    .derived-memory-group-head span {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.35;
    }

    .derived-memory-form-list {
      display: grid;
      gap: 5px;
    }

    .derived-memory-form {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: baseline;
      gap: 6px;
      padding: 5px 6px;
      border-left: 3px solid var(--accent-muted);
      background: var(--wash);
    }

    .derived-memory-form-label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .derived-memory-form-content {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    .derived-memory-form-result {
      color: var(--ink);
      font-family: var(--display);
      font-size: .94rem;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .derived-memory-form-rule {
      color: var(--muted);
      font-size: .66rem;
      line-height: 1.3;
    }

    .exception-memory {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--danger);
      background:
        linear-gradient(110deg, rgba(var(--vermilion-rgb), .06), transparent 60%),
        var(--surface);
    }

    .exception-memory-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .exception-memory-head h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.2rem;
    }

    .exception-memory-head p {
      max-width: 760px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .exception-memory-head-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--danger);
      color: var(--danger);
      background: var(--danger-soft);
      font-size: .7rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .exception-memory-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .exception-memory-card {
      display: grid;
      align-content: start;
      gap: 7px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--surface-strong);
    }

    .exception-memory-tag {
      color: var(--danger);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .exception-memory-card h4 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: .92rem;
      line-height: 1.3;
    }

    .exception-memory-equation {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .98rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .exception-memory-note {
      padding-top: 6px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.45;
    }

    .reference-details {
      border: 2px solid var(--line-strong);
      background: var(--surface);
    }

    .reference-details[open] {
      border-color: var(--vermilion);
    }

    .reference-details summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      color: var(--vermilion-deep);
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .08), transparent 65%),
        var(--wash);
      cursor: pointer;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 900;
      list-style: none;
    }

    .reference-details summary::-webkit-details-marker {
      display: none;
    }

    .reference-details summary::after {
      color: var(--muted);
      content: "展开查询";
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 800;
    }

    .reference-details[open] summary::after {
      content: "收起查询";
    }

    .reference-details-note {
      color: var(--muted);
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 700;
    }

    .reference-details-body {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid var(--line-strong);
    }

    /* P3：派生形行内锚点胶囊 */
    .row-anchors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 6px;
      padding-bottom: 2px;
    }

    .row-anchor {
      padding: 4px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      color: var(--vermilion-deep);
      background: var(--surface);
      font-size: .74rem;
      font-weight: 800;
      text-decoration: none;
      transition: border-color .2s ease, background-color .2s ease;
    }

    .row-anchor:hover {
      border-color: var(--vermilion);
      background: var(--vermilion-soft);
    }


    .rule-table tbody tr {
      scroll-margin-top: 96px;
    }

    /* 派生形分类筛选（5 大类 chip） */
    .derived-categories {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .derived-categories .type-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .derived-categories .chip-count {
      display: inline-block;
      min-width: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--vermilion-soft);
      color: var(--vermilion-deep);
      font-size: .68rem;
      font-weight: 900;
    }

    .derived-reset {
      padding: 4px 10px;
      border: 1px solid var(--line-strong);
      color: var(--vermilion-deep);
      background: var(--surface);
      cursor: pointer;
      font-size: .74rem;
      font-weight: 800;
    }

    .derived-reset:hover {
      border-color: var(--vermilion);
      background: var(--vermilion-soft);
    }

    /* P3：练习设置折叠 */
    .config-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
    }

    .config-title {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 900;
    }

    .config-toggle {
      padding: 0;
      border: 0;
      color: var(--vermilion-deep);
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 900;
    }

    .config-toggle:hover {
      text-decoration: underline;
    }

    .config-summary {
      margin-left: auto;
      color: var(--muted);
      font-size: .74rem;
    }

    .hint-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .hint-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .hint-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--vermilion);
    }

    .practice-config.is-folded .config-rows {
      display: none;
    }


    .table-scroll {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: auto;
      border: 2px solid var(--vermilion-deep);
      border-radius: 2px;
      background: var(--surface-strong);
      box-shadow: 6px 7px 0 rgba(var(--vermilion-deep-rgb), .08);
      scrollbar-color: var(--vermilion) var(--vermilion-soft);
    }

    .rule-table {
      width: 100%;
      min-width: 1060px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .rule-table th,
    .rule-table td {
      padding: 10px;
      border: 1px solid rgba(var(--vermilion-deep-rgb), .28);
      vertical-align: top;
    }

    .rule-table thead th {
      position: sticky;
      z-index: 5;
      top: 0;
      color: var(--surface-strong);
      background:
        repeating-linear-gradient(45deg, transparent 0 11px, rgba(var(--surface-rgb), .08) 12px 13px, transparent 14px 26px),
        var(--vermilion-deep);
      font-size: .84rem;
      text-align: left;
    }

    .rule-table thead th:first-child {
      left: 0;
      z-index: 8;
      width: 132px;
      min-width: 132px;
      text-align: center;
    }

    .form-header-main {
      display: block;
      font-family: var(--display);
      font-size: .94rem;
      letter-spacing: .08em;
      line-height: 1.2;
    }

    .form-header-sub {
      display: block;
      margin-top: 3px;
      color: rgba(var(--surface-rgb), .72);
      font-family: var(--mono);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .16em;
      line-height: 1;
      text-transform: uppercase;
    }

    .rule-table .form-cell {
      position: sticky;
      left: 0;
      z-index: 4;
      width: 132px;
      min-width: 132px;
      padding: 12px 8px;
      color: var(--vermilion-deep);
      background:
        repeating-linear-gradient(45deg, transparent 0 9px, rgba(var(--vermilion-rgb), .025) 10px 11px, transparent 12px 22px),
        var(--wash);
      box-shadow: inset 4px 0 0 var(--vermilion);
      vertical-align: middle;
      text-align: center;
    }

    .rule-table .form-cell[data-form-group="base"] {
      box-shadow: inset 6px 0 0 var(--vermilion);
    }

    .form-cell-content {
      display: grid;
      min-height: 132px;
      align-content: center;
      justify-items: center;
      gap: 6px;
    }

    .form-index {
      display: inline-grid;
      min-width: 30px;
      height: 24px;
      place-items: center;
      padding: 0 7px;
      border: 1px solid var(--vermilion);
      border-radius: 999px;
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      line-height: 1;
    }

    .rule-table tbody tr:hover .form-cell {
      background: var(--vermilion-soft);
    }

    .rule-table tr:last-child td,
    .rule-table tr:last-child .form-cell {
      border-bottom: 0;
    }

    .rule-table th:last-child,
    .rule-table td:last-child {
      border-right: 0;
    }

    .form-name {
      display: block;
      max-width: 100%;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .form-jp {
      display: block;
      margin-top: 0;
      color: var(--accent-muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      line-height: 1.3;
    }

    .form-cell[data-form-group="derived"] .form-index {
      border-color: var(--line-strong);
      color: var(--accent-muted);
      background: var(--surface);
    }

    .rule-card {
      min-width: 190px;
      height: 162px;
      perspective: none;
      animation: stamp-card-in .5s cubic-bezier(.18, .8, .2, 1) both;
      animation-delay: var(--card-delay, 0ms);
    }

    .rule-card-button {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .rule-card-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
    }

    .rule-card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border: 3px double var(--vermilion);
      border-radius: 2px;
      background:
        repeating-linear-gradient(45deg, transparent 0 10px, rgba(var(--vermilion-rgb), .025) 11px 12px, transparent 13px 24px),
        var(--surface);
      box-shadow: 4px 5px 0 rgba(var(--vermilion-deep-rgb), .08);
      overflow: hidden;
      pointer-events: none;
      transition: opacity .32s ease, transform .38s cubic-bezier(.18, .8, .2, 1), box-shadow .25s ease;
    }

    .rule-card-face::before {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 9px;
      height: 9px;
      border: 1px solid var(--accent-muted);
      content: "";
      transform: rotate(45deg);
    }

    .rule-card-front {
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    .rule-card-back {
      border-color: var(--vermilion-deep);
      color: var(--surface-strong);
      background:
        repeating-linear-gradient(45deg, transparent 0 10px, rgba(var(--surface-rgb), .04) 11px 12px, transparent 13px 24px),
        var(--vermilion);
      opacity: 0;
      transform: scale(.88) rotate(2deg);
    }

    .rule-card.is-flipped .rule-card-front {
      opacity: 0;
      transform: scale(.88) rotate(-2deg);
    }

    .rule-card.is-flipped .rule-card-back {
      opacity: 1;
      transform: scale(1) rotate(-.25deg);
    }

    .rule-card:hover {
      z-index: 7;
    }

    .rule-card:hover .rule-card-front,
    .rule-card:hover .rule-card-back {
      box-shadow: 7px 8px 0 rgba(var(--vermilion-deep-rgb), .12);
    }

    .card-kicker {
      color: var(--vermilion-deep);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* 翻面文字/装饰统一为浅色调（朱红背景上的可读性） */
    .rule-card-back .card-kicker,
    .rule-card-back .card-example-result,
    .rule-card-back .card-example-process,
    .rule-card-back .card-example-meaning,
    .rule-card-back .flip-hint,
    .rule-card-back .breakdown,
    .rule-card-back .breakdown ruby,
    .rule-card-back .breakdown rt,
    .rule-card-back .card-example-result rt,
    .rule-card-back .flip-hint::before {
      color: var(--surface-strong);
    }

    .rule-card-back .breakdown .affix {
      color: var(--surface-strong);
      background: transparent;
      border-color: rgba(var(--surface-rgb), .35);
    }

    .card-rule {
      display: block;
      margin: 8px 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: .94rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .card-detail,
    .card-example-process,
    .card-example-meaning {
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.4;
    }

    .card-example {
      display: grid;
      gap: 4px;
      margin-top: auto;
    }

    .card-example-result {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 900;
    }

    /* 振り仮名（ruby）与词干/接续分解 */
    .card-example-result ruby,
    .breakdown ruby {
      ruby-position: over;
    }

    .card-example-result rt {
      font-size: .74rem;
      font-weight: 600;
      color: var(--accent-muted);
    }

    .breakdown {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      color: var(--accent-muted);
      font-size: .74rem;
    }

    .breakdown ruby {
      color: var(--vermilion-deep);
      font-weight: 900;
    }

    .breakdown rt {
      font-size: .74rem;
      font-weight: 600;
      color: var(--accent-muted);
    }

    .breakdown .affix {
      padding: 1px 5px;
      border: 1px dashed var(--line-strong);
      border-radius: 2px;
      color: var(--success);
      background: var(--success-soft);
      font-weight: 800;
    }

    .flip-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 800;
    }

    .flip-hint::before {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      border: 1px solid var(--accent-muted);
      border-radius: 2px;
      color: var(--vermilion-deep);
      background: var(--wash);
      content: "印";
      font-family: var(--display);
      font-size: .74rem;
      font-weight: 900;
    }

    .rule-card-back .flip-hint::before {
      border-color: rgba(var(--surface-rgb), .7);
      color: var(--surface-strong);
      background: transparent;
    }

    /* 五段音变对照：并入规则表下方的紧凑附件 */
    .sound-annex {
      display: grid;
      gap: 10px;
      margin-top: 4px;
      padding: 12px 16px 16px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--vermilion);
      border-radius: 0 0 2px 2px;
      background: var(--surface);
    }

    .sound-annex-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .sound-annex h3 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1rem;
    }

    .sound-annex-hint {
      color: var(--muted);
      font-size: .74rem;
    }

    .sound-memory-order {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 9px;
      border-left: 3px solid var(--vermilion);
      background: var(--wash);
    }

    .sound-memory-step {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }

    .sound-memory-step + .sound-memory-step::before {
      margin-right: 3px;
      color: var(--accent-muted);
      content: "→";
    }

    .sound-memory-step strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .82rem;
    }

    .sound-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: .8rem;
    }

    .sound-table th,
    .sound-table td {
      padding: 8px 9px;
      border: 1px solid rgba(var(--vermilion-deep-rgb), .24);
      text-align: center;
    }

    .sound-table th {
      color: var(--vermilion-deep);
      background: var(--surface-strong);
      font-weight: 900;
    }

    .sound-table thead th {
      padding-top: 9px;
      padding-bottom: 9px;
      background:
        linear-gradient(180deg, rgba(var(--vermilion-rgb), .1), transparent),
        var(--surface-strong);
      font-size: .76rem;
      letter-spacing: .03em;
    }

    .sound-table .sound-tail-cell {
      width: 72px;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.08rem;
    }

    .sound-table .sound-vowel-cell {
      width: 128px;
      color: var(--ink);
      font-family: var(--display);
      font-size: .9rem;
      font-weight: 800;
      vertical-align: middle;
    }

    .sound-rule-value {
      display: block;
      color: var(--accent-muted);
      font-family: var(--mono);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1;
    }

    .sound-vowel-example {
      display: block;
      margin-top: 5px;
      color: var(--ink);
      font-family: var(--display);
      font-size: .88rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .sound-vowel-example rt {
      color: var(--accent-muted);
      font-family: var(--sans);
      font-size: .54rem;
      font-weight: 700;
    }

    .sound-table .sound-result-cell {
      width: 178px;
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .06), transparent),
        var(--surface);
      font-family: var(--display);
      vertical-align: middle;
    }

    .sound-result {
      display: block;
      color: var(--vermilion-deep);
      font-size: .98rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .sound-example {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px 5px;
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed var(--line-strong);
      text-align: center;
    }

    .sound-example-label {
      color: var(--muted);
      font-family: var(--sans);
      font-size: .62rem;
      font-weight: 900;
    }

    .sound-example-word {
      color: var(--ink);
      font-family: var(--display);
      font-size: .8rem;
      font-weight: 900;
    }

    .sound-example-word rt {
      color: var(--accent-muted);
      font-family: var(--sans);
      font-size: .56rem;
      font-weight: 700;
    }

    .sound-example-arrow {
      color: var(--accent-muted);
      font-family: var(--sans);
      font-size: .7rem;
      font-weight: 900;
    }

    .sound-example-result {
      color: var(--muted);
      font-family: var(--display);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .sound-group-row th {
      padding: 7px 10px;
      border-top: 3px solid var(--vermilion);
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .14), transparent 68%),
        var(--vermilion-soft);
      text-align: left;
    }

    .sound-group-row:first-child th {
      border-top-width: 1px;
    }

    .sound-group-content {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .sound-group-label {
      display: inline-flex;
      min-width: 68px;
      min-height: 25px;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border: 1px solid var(--vermilion-deep);
      border-radius: 999px;
      color: var(--surface-strong);
      background: var(--vermilion-deep);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .sound-group-memory {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .9rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .sound-group-hint {
      margin-left: auto;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
    }

    .sound-group-row.sound-group-ion th {
      border-top-color: var(--accent-muted);
      background:
        linear-gradient(90deg, rgba(var(--accent-rgb), .15), transparent 68%),
        var(--wash);
    }

    .sound-group-row.sound-group-ion .sound-group-label {
      border-color: var(--accent-muted);
      background: var(--accent-muted);
    }

    .sound-group-row.sound-group-shion th {
      border-top-color: var(--success);
      background:
        linear-gradient(90deg, rgba(var(--success-rgb), .13), transparent 68%),
        var(--wash);
    }

    .sound-group-row.sound-group-shion .sound-group-label {
      border-color: var(--success);
      background: var(--success);
    }

    .sound-group-row.sound-group-hatsuon th {
      border-top-color: var(--vermilion-deep);
    }

    .sound-table .sound-exception-row th {
      padding: 10px;
      border: 1px solid var(--vermilion);
      color: var(--muted);
      background: var(--surface);
      text-align: left;
    }

    .sound-exception-content {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px 10px;
    }

    .sound-exception-label {
      color: var(--vermilion-deep);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .sound-exception-word {
      color: var(--ink);
      font-family: var(--display);
      font-weight: 900;
    }

    .sound-exception-result {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 900;
    }

    .sound-exception-note {
      color: var(--muted);
      font-size: .72rem;
    }

    .sound-table tbody tr.sound-rule-row:hover th,
    .sound-table tbody tr.sound-rule-row:hover td {
      background-color: var(--wash-hover);
    }

    .sound-table tbody tr.sound-rule-row:hover .sound-result-cell {
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .1), transparent),
        var(--wash-hover);
    }

    .sound-table tfoot {
      border-top: 10px solid var(--surface);
    }

    .sound-table tfoot th {
      border-bottom: 0;
    }

    .sound-table tbody .sound-rule-row > th {
      background: var(--vermilion-soft);
      font-family: var(--display);
    }

    .exception-callout {
      display: flex;
      align-items: start;
      gap: 9px;
      padding: 10px 12px;
      border: 1px solid var(--vermilion);
      border-radius: 2px;
      color: var(--muted);
      background: var(--surface);
      font-size: .8rem;
    }

    .exception-callout strong {
      color: var(--vermilion-deep);
    }

    .practice-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: var(--wash);
    }

    /* 练习设置区（类型筛选 / 形范围 / 题数） */
    .practice-config {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding: 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-small);
      background: var(--surface-strong);
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .config-label {
      width: 64px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 900;
    }

    .type-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .type-chip {
      padding: 6px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--muted);
      background: var(--wash);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 900;
      transition: border-color .2s ease, color .2s ease, background-color .2s ease;
    }

    .type-chip:hover {
      border-color: var(--vermilion);
    }

    .type-chip[aria-pressed="true"],
    .type-chip.is-active {
      border-color: var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
    }

    .count-select {
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--ink);
      background: var(--surface);
      font-size: .8rem;
      font-weight: 700;
    }

    .start-actions {
      margin-top: 12px;
    }

    .start-actions .primary-button,
    .start-actions .secondary-button {
      padding: 9px 18px;
    }

    .start-actions .secondary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .mode-switch {
      display: flex;
      gap: 5px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface);
    }

    .mode-button {
      padding: 7px 12px;
      border: 2px solid transparent;
      border-radius: 2px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 900;
    }

    .mode-button[aria-pressed="true"] {
      border-color: var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
    }

    .practice-prompt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background:
        linear-gradient(110deg, rgba(var(--vermilion-rgb), .08), transparent 62%),
        var(--surface-strong);
    }

    .practice-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 9px 14px;
    }

    .practice-word strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: .05em;
      line-height: 1;
    }

    .practice-word span {
      color: var(--accent-muted);
      font-size: 1rem;
      font-weight: 900;
    }

    .practice-word small {
      flex-basis: 100%;
      color: var(--muted);
      font-size: .84rem;
    }

    .practice-prompt-side {
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
    }

    .practice-prompt-side strong {
      display: block;
      margin-bottom: 3px;
      color: var(--vermilion-deep);
      font-size: .94rem;
    }

    .practice-group {
      display: grid;
      gap: 10px;
    }

    .practice-group h3 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.15rem;
    }

    .practice-group h3::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .practice-list {
      display: grid;
      gap: 8px;
    }

    .practice-row {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      align-items: start;
      gap: 14px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface-strong);
    }

    .progressive-row {
      grid-template-columns: minmax(180px, .85fr) 150px minmax(0, 1fr);
      align-items: center;
    }

    .progressive-question {
      display: grid;
      gap: 7px;
    }

    .question-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .question-word strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .question-word span {
      color: var(--accent-muted);
      font-size: .82rem;
      font-weight: 900;
    }

    .question-word small {
      flex-basis: 100%;
      color: var(--muted);
      font-size: .74rem;
    }

    .sentence-prompt {
      padding: 7px 9px;
      border-left: 3px solid var(--vermilion);
      color: var(--ink);
      background: var(--wash);
      font-family: var(--display);
      font-size: .95rem;
      font-weight: 800;
    }

    .sentence-prompt small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 600;
    }

    .conversion-prompt {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px 8px;
      padding: 7px 9px;
      border-left: 3px solid var(--accent-muted);
      color: var(--muted);
      background: var(--wash);
      font-size: .78rem;
    }

    .conversion-prompt strong {
      color: var(--ink);
      font-family: var(--display);
      font-size: .96rem;
    }

    .conversion-prompt em {
      color: var(--vermilion-deep);
      font-size: 1.1rem;
      font-style: normal;
      font-weight: 900;
    }

    .conversion-prompt small {
      flex-basis: 100%;
      font-size: .72rem;
    }

    .progressive-answer {
      min-width: 0;
    }

    .practice-row.is-correct {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .practice-row.is-wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .practice-row-label {
      display: grid;
      gap: 2px;
    }

    .practice-row-label strong {
      font-family: var(--display);
      font-size: .92rem;
    }

    .practice-row-label span {
      color: var(--vermilion-deep);
      font-size: .74rem;
    }

    .practice-row-label small {
      margin-top: 3px;
      color: var(--muted);
      font-size: .74rem;
    }

    .answer-field {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--ink);
      background: var(--surface);
    }

    .answer-field::placeholder {
      color: rgba(128, 110, 104, .72);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .choice-option {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 40px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 800;
      transition: border-color .2s ease, background-color .2s ease, transform .2s ease;
    }

    .choice-option:hover {
      border-color: var(--vermilion);
      background: var(--vermilion-soft);
      transform: translateY(-1px);
    }

    .choice-option:has(input:checked) {
      border: 2px solid var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
    }

    .choice-option input {
      position: absolute;
      opacity: 0;
    }

    .choice-option em {
      margin-left: auto;
      color: var(--accent-muted);
      font-family: var(--sans);
      font-size: .74rem;
      font-style: normal;
    }

    .practice-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 2px;
    }

    .primary-button,
    .secondary-button {
      padding: 9px 14px;
      border-radius: 2px;
      cursor: pointer;
      font-weight: 900;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    }

    .primary-button {
      border: 3px double var(--vermilion-deep);
      color: var(--surface-strong);
      background: var(--vermilion);
      box-shadow: 4px 4px 0 rgba(var(--vermilion-deep-rgb), .1);
    }

    .secondary-button {
      border: 1px solid var(--line-strong);
      color: var(--vermilion-deep);
      background: var(--surface-strong);
    }

    .primary-button:hover,
    .secondary-button:hover {
      box-shadow: 6px 6px 0 rgba(var(--vermilion-deep-rgb), .1);
      transform: translateY(-1px);
    }

    .assistive-copy {
      margin-left: auto;
      color: var(--muted);
      font-size: .74rem;
    }

    .result-summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--vermilion);
      border-radius: 2px;
      background: var(--vermilion-soft);
    }

    .score-bubble {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      border: 4px double var(--vermilion);
      border-radius: 2px;
      color: var(--vermilion-deep);
      background: var(--surface-strong);
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 900;
      transform: rotate(-2deg);
    }

    .score-bubble span {
      display: block;
      margin-top: -17px;
      font-family: var(--sans);
      font-size: .74rem;
      font-weight: 700;
    }

    .result-summary h3 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.05rem;
    }

    .result-summary p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .result-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 6px;
      margin-top: 9px;
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface-strong);
      font-size: .74rem;
    }

    .result-item strong {
      font-family: var(--display);
    }

    .result-item.is-correct {
      color: var(--success);
    }

    .result-item.is-wrong {
      color: var(--danger);
    }

    .result-item small {
      color: var(--muted);
      font-family: var(--display);
      font-size: .8rem;
    }

    .data-error {
      padding: 16px;
      border: 2px solid var(--danger);
      border-radius: 2px;
      color: var(--danger);
      background: var(--danger-soft);
    }

    .data-error strong {
      display: block;
      margin-bottom: 5px;
    }

    .usage-reference {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--accent-muted);
      background: var(--wash);
    }

    .usage-reference-head {
      display: grid;
      gap: 3px;
    }

    .usage-reference-head h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.15rem;
    }

    .usage-reference-head p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .usage-grid,
    .contrast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .usage-card,
    .contrast-card {
      display: grid;
      align-content: start;
      gap: 5px;
      padding: 11px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .usage-card h4,
    .contrast-card h4 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .9rem;
    }

    .usage-card-sentence,
    .contrast-row-sentence {
      color: var(--ink);
      font-family: var(--display);
      font-size: .95rem;
      font-weight: 800;
    }

    .usage-card-translation,
    .usage-card-note,
    .contrast-card-note,
    .contrast-row-translation {
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.4;
    }

    .usage-card-note {
      padding-top: 4px;
      border-top: 1px dashed var(--line);
    }

    .contrast-card {
      gap: 8px;
    }

    .contrast-card-note {
      margin: 0;
    }

    .contrast-row {
      display: grid;
      gap: 2px;
      padding-top: 7px;
      border-top: 1px solid var(--line);
    }

    .contrast-row-label {
      color: var(--vermilion-deep);
      font-size: .72rem;
