            <div>
              <p class="eyebrow">Practice / 练习</p>
              <h3>翻开一页，亲手盖出答案</h3>
              <p>从词库随机抽词、按规则实时变形；选好类型与题数后开始，错题会进入累计错题集。</p>
            </div>
            <div class="intro-note">词库 <strong>${lexicon.length} 词</strong><br>待复习 ${wrongCount} 条<br><small>连续答对 3 次后移出</small></div>
          </div>
          <div class="practice-toolbar">
            <div class="mode-switch" aria-label="练习模式">
              <button class="mode-button" type="button" data-action="set-mode" data-mode="simple"
                aria-pressed="${state.practiceMode === "simple"}">简易模式</button>
              <button class="mode-button" type="button" data-action="set-mode" data-mode="standard"
                aria-pressed="${state.practiceMode === "standard"}">标准模式</button>
            </div>
            <span class="assistive-copy">统计保存在本机浏览器（localStorage）</span>
          </div>

          <section class="practice-config ${hasSession && !state.configOpen ? "is-folded" : ""}" aria-label="练习设置">
            <div class="config-head">
              <span class="config-title">练习设置</span>
              ${hasSession ? `
                <button class="config-toggle" type="button" data-action="toggle-config"
                  aria-expanded="${state.configOpen ? "true" : "false"}">${state.configOpen ? "收起设置" : "展开设置"}</button>
                <span class="config-summary">当前：${kindLabel} · ${scopeLabel} · ${state.practiceCount} 题</span>
              ` : ""}
            </div>
            <div class="config-rows">
            <div class="config-row">
              <span class="config-label">题型</span>
              <div class="type-chips practice-kinds">
                ${Object.entries(PRACTICE_KIND_LABELS).map(([id, label]) => `
                  <button class="type-chip ${state.practiceKind === id ? "is-active" : ""}"
                    type="button" data-action="set-practice-kind" data-kind="${id}"
                    aria-pressed="${state.practiceKind === id}" title="${PRACTICE_KIND_DESCRIPTIONS[id]}">${label}</button>
                `).join("")}
              </div>
            </div>
            <div class="config-row">
              <span class="config-label">词类</span>
              <div class="type-chips">
                ${typeColumns.map((type) => `
                  <button class="type-chip ${state.practiceTypes.includes(type.id) ? "is-active" : ""}"
                    type="button" data-action="toggle-practice-type" data-type-id="${type.id}"
                    aria-pressed="${state.practiceTypes.includes(type.id)}">${type.label}</button>
                `).join("")}
              </div>
            </div>
            <div class="config-row">
              <span class="config-label">题数</span>
              <select class="count-select" data-action="set-practice-count" aria-label="每次练习题数">
                ${[3, 6].map((n) => `
                  <option value="${n}" ${state.practiceCount === n ? "selected" : ""}>${n} 题</option>
                `).join("")}
              </select>
              <span class="assistive-copy">从「${scopeLabel}」中随机抽取</span>
            </div>
            <div class="config-row">
              <span class="config-label">提示</span>
              <div class="hint-options">
                <label class="hint-option">
                  <input type="checkbox" data-action="toggle-hint" data-hint="kana" ${state.showKana ? "checked" : ""}>
                  显示假名
                </label>
                <label class="hint-option">
                  <input type="checkbox" data-action="toggle-hint" data-hint="meaning" ${state.showMeaning ? "checked" : ""}>
                  显示中文
                </label>
              </div>
            </div>
            </div>
          </section>

          <div class="practice-actions start-actions">
            <button class="primary-button" type="button" data-action="start-practice">开始新练习</button>
            <button class="secondary-button" type="button" data-action="retry-wrong"
              ${wrongCount === 0 ? "disabled" : ""}>错题再练（${wrongCount}）</button>
            <button class="secondary-button" type="button" data-action="clear-stats">清空统计</button>
          </div>

          ${hasSession ? `
            ${progressiveSession ? `
              <div class="practice-prompt">
                <div class="practice-word">
                  <strong>${kindLabel}</strong>
                  <small>每题会${state.practiceKind === "classify" ? "先要求判断词类" : "随机更换词条"}，用来练习迁移。</small>
                </div>
                <div class="practice-prompt-side">
                  <strong>${state.onlyWrong ? "错题复习" : "本次练习"}</strong>
                  <span>范围：${scopeLabel} · 共 ${items.length} 题 · ${state.showKana ? "显示假名" : "隐藏假名"} · ${state.showMeaning ? "显示中文" : "隐藏中文"}。</span>
                </div>
              </div>
            ` : `
              <div class="practice-prompt">
                <div class="practice-word">
                  <strong>${state.currentVerb.dictionary}</strong>
                  ${state.showKana ? `<span>${state.currentVerb.kana}</span>` : ""}
                  ${state.showMeaning ? `<small>中文：${state.currentVerb.meaning}</small>` : ""}
                </div>
                <div class="practice-prompt-side">
                  <strong>${state.onlyWrong ? "错题复习" : "本次练习"}</strong>
                  <span>范围：${scopeLabel} · 共 ${items.length} 题 · 词类不直接显示，先自行判断。</span>
                </div>
              </div>
            `}
            ${getResultSummary()}
            <section class="practice-group">
              <h3>${progressiveSession ? `${kindLabel} · ${items.length} 题` : `${state.currentVerb.dictionary} 的 ${items.length} 个活用形`}</h3>
              <div class="practice-list">${items.map((item) => progressiveSession ? renderProgressiveRow(item) : renderPracticeRow(item.form)).join("")}</div>
            </section>
            <div class="practice-actions">
              <button class="primary-button" type="button" data-action="check-practice">检查答案</button>
              <button class="secondary-button" type="button" data-action="reset-practice">清空作答</button>
              <button class="secondary-button" type="button" data-action="start-practice">重新抽题</button>
            </div>
          ` : `
            <div class="exception-callout"><span aria-hidden="true">印</span><span><strong>还没有练习会话。</strong>设置好类型与题数后，点击「开始新练习」随机抽词。</span></div>
          `}
        </section>
      `;
    }

    function renderApp() {
      elements.appShell.innerHTML = `
        <header class="app-header">
          <a class="brand brand-link" href="index.html" aria-label="返回日语学习印谱方格首页">
            <span class="brand-seal" aria-hidden="true">形</span>
            <div>
              <h2>形・名詞ノート</h2>
              <p>印谱方格 · 形容词与名词规则与练习</p>
            </div>
          </a>
          <span class="edition-note">${getThemeHeadline().edition}</span>
          ${renderThemeSwitcher()}
        </header>
        <nav class="main-tabs" role="tablist" aria-label="主要区域">
          <button class="main-tab" id="view-rules-tab" type="button" role="tab"
            ${state.view === "rules" ? 'aria-controls="rules-panel"' : ""}
            aria-selected="${state.view === "rules"}" data-view="rules">规则讲解</button>
          <button class="main-tab" id="view-practice-tab" type="button" role="tab"
            ${state.view === "practice" ? 'aria-controls="practice-panel"' : ""}
            aria-selected="${state.view === "practice"}" data-view="practice">练习</button>
        </nav>
        ${state.view === "rules" ? renderRulesPanel() : renderPracticePanel()}
      `;
      const referenceDetails = elements.appShell.querySelector(".reference-details");
      if (referenceDetails) {
        referenceDetails.addEventListener("toggle", () => {
          state.referenceOpen = referenceDetails.open;
          saveSessionState();
        });
      }
      window.NihongoTheme.updateSwitcher();
    }

    function setView(view, addHistory = true) {
      state.view = view === "practice" ? "practice" : "rules";
      writeUrlState(addHistory);
      renderApp();
      announce(state.view === "rules" ? "已切换到规则讲解" : "已切换到练习");
    }

    function getSubmittedAnswer(item) {
      return state.practiceMode === "simple"
        ? state.choices[item.id] || "" : state.answers[item.id] || "";
    }

    function checkProgressivePractice() {
      const items = getProgressiveItems();
      if (!items.length) {
        announce("还没有练习题目，请先「开始新练习」。");
        return;
      }
      const submissions = items.map((item) => [item.id, getSubmittedAnswer(item)]);
      const signature = JSON.stringify({
        kind: state.practiceKind,
        questions: state.currentQuestions,
        mode: state.practiceMode,
        revision: state.answerRevision,
        submissions
      });
      if (state.result && state.lastCheckedSignature === signature) {
        announce("答案没有变化，本次检查不重复计入统计。");
        return;
      }
      const resultItems = {};
      items.forEach((item, index) => {
        const submitted = submissions[index][1];
        const correct = item.accepted.map(normalizeAnswer).includes(normalizeAnswer(submitted));
        const formKey = item.formKey || (item.form ? item.form.id : "__type__");
        resultItems[item.id] = { correct, submitted };
        state.stats.byVerb[item.verb.dictionary] = state.stats.byVerb[item.verb.dictionary] || { t: 0, c: 0 };
        state.stats.byVerb[item.verb.dictionary].t += 1;
        state.stats.byForm[formKey] = state.stats.byForm[formKey] || { t: 0, c: 0 };
        state.stats.byForm[formKey].t += 1;
        if (correct) {
          state.stats.byVerb[item.verb.dictionary].c += 1;
          state.stats.byForm[formKey].c += 1;
          resolveWrongItem(item.verb.dictionary, formKey);
        } else {
          recordWrongItem(item.verb.dictionary, formKey);
        }
      });
      state.result = { kind: state.practiceKind, items: resultItems, checkedAt: Date.now() };
      state.lastCheckedSignature = signature;
      state.onlyWrong = false;
      saveStats();
      saveSessionState();
      renderApp();
      announce(`答案已检查：${getPracticeKindLabel(state.practiceKind)} ${items.length} 题，累计统计已更新。`);
    }

    function checkPractice() {
      if (state.currentQuestions.length) {
        checkProgressivePractice();
        return;
      }
      const items = getPracticeItems();
      if (!items.length) {
        announce("还没有练习题目，请先「开始新练习」。");
        return;
      }
      const verbKey = state.currentVerb.dictionary;
      const submissions = items.map(({ form }) => [
        form.id,
        state.practiceMode === "simple" ? state.choices[form.id] || "" : state.answers[form.id] || ""
      ]);
      const signature = JSON.stringify({
        verb: verbKey,
        forms: state.currentForms,
        mode: state.practiceMode,
        revision: state.answerRevision,
        submissions
      });
      if (state.result && state.lastCheckedSignature === signature) {
        announce("答案没有变化，本次检查不重复计入统计。");
        return;
      }
      const resultItems = {};
      items.forEach(({ form, accepted }, index) => {
        const submitted = submissions[index][1];
        const correct = accepted.map(normalizeAnswer).includes(normalizeAnswer(submitted));
        resultItems[form.id] = { correct, submitted };
        // 累计统计（A5：localStorage 长期保存）
        state.stats.byVerb[verbKey] = state.stats.byVerb[verbKey] || { t: 0, c: 0 };
        state.stats.byVerb[verbKey].t += 1;
        state.stats.byForm[form.id] = state.stats.byForm[form.id] || { t: 0, c: 0 };
        state.stats.byForm[form.id].t += 1;
        if (correct) {
          state.stats.byVerb[verbKey].c += 1;
          state.stats.byForm[form.id].c += 1;
          resolveWrongItem(verbKey, form.id);
        } else {
          recordWrongItem(verbKey, form.id);
        }
      });
      state.result = { verb: verbKey, items: resultItems, checkedAt: Date.now() };
      state.lastCheckedSignature = signature;
      state.onlyWrong = false;
      saveStats();
      saveSessionState();
      renderApp();
      announce(`答案已检查：${verbKey} 本次 ${items.length} 题，累计统计已更新。`);
    }

    function resetPractice() {
      state.answers = {};
      state.choices = {};
      state.result = null;
      state.answerRevision += 1;
      state.lastCheckedSignature = null;
      state.onlyWrong = false;
      saveSessionState();
      renderApp();
      announce("当前练习的作答已清空，可以重新填写。");
    }

    function handleAction(target) {
      const action = target.dataset.action;
      if (!action) {
        return;
      }

      if (action === "toggle-theme-panel") {
        const switcher = target.closest(".theme-switcher");
        if (switcher) {
          const open = !switcher.classList.contains("is-open");
          switcher.classList.toggle("is-open", open);
          target.setAttribute("aria-expanded", String(open));
        }
        return;
      }

      if (action === "select-theme") {
        const applied = window.NihongoTheme.apply(target.dataset.themeId);
        document.querySelectorAll(".theme-switcher").forEach((el) => {
          el.classList.remove("is-open");
        });
        window.NihongoTheme.updateSwitcher();
        applyThemeHeadline();
        announce(`主题已切换为「${window.NihongoTheme.labels[applied] || applied}」。`);
        return;
      }

      if (action === "flip-card") {
        const card = target.closest("[data-card-id]");
        if (!card) {
          return;
        }
        const cardId = card.dataset.cardId;
        const flipped = !state.cardFlips[cardId];
        state.cardFlips[cardId] = flipped;
        saveSessionState();
        card.classList.toggle("is-flipped", flipped);
        const button = card.querySelector(".rule-card-button");
        if (button) {
          button.setAttribute("aria-expanded", String(flipped));
          const label = button.getAttribute("aria-label") || "";
          button.setAttribute("aria-label", flipped
            ? label.replace(/^查看/, "收起")
            : label.replace(/^收起/, "查看"));
        }
        return;
      }

      if (action === "set-form-group") {
        const scope = target.dataset.scope === "practice" ? "practice" : "rules";
        state.activeGroups[scope] = target.dataset.groupId === "derived" ? "derived" : "base";
        saveSessionState();
        renderApp();
        announce(`${scope === "rules" ? "规则讲解" : "练习"}已切换到${state.activeGroups[scope] === "base" ? "基础六形" : "派生／接续形"}。`);
        return;
      }

      if (action === "set-mode") {
        state.practiceMode = target.dataset.mode === "standard" ? "standard" : "simple";
        state.result = null;
        state.answerRevision += 1;
        state.lastCheckedSignature = null;
        saveSessionState();
        renderApp();
        announce(state.practiceMode === "simple" ? "已切换到简易模式" : "已切换到标准模式");
        return;
      }

      if (action === "set-practice-kind") {
        const kind = ["same", "mixed", "sentence", "classify", "polite"].includes(target.dataset.kind)
          ? target.dataset.kind : "same";
        if (state.practiceKind === kind) {
          return;
        }
        state.practiceKind = kind;
        state.currentVerb = null;
        state.currentForms = [];
        state.currentQuestions = [];
        state.answers = {};
        state.choices = {};
        state.result = null;
        state.answerRevision += 1;
        state.lastCheckedSignature = null;
        saveSessionState();
        renderApp();
        announce(`题型已切换为${getPracticeKindLabel(kind)}，请开始新练习。`);
        return;
      }

      if (action === "toggle-practice-type") {
        const typeId = target.dataset.typeId;
        const index = state.practiceTypes.indexOf(typeId);
        if (index >= 0) {
          if (state.practiceTypes.length > 1) {
            state.practiceTypes.splice(index, 1);
          } else {
            announce("至少保留一种词类。");
            return;
          }
        } else {
          state.practiceTypes.push(typeId);
        }
        saveSessionState();
        renderApp();
        announce("练习词类范围已更新。");
        return;
      }

      if (action === "set-practice-scope") {
        const scope = target.dataset.scope;
        if (scope === "base" || scope === "derived" || scope === "all") {
          state.practiceScope = scope;
          saveSessionState();
          renderApp();
          announce(scope === "base" ? "抽题范围：基础六形" : scope === "derived" ? "抽题范围：派生形" : "抽题范围：全部 6 形");
        }
        return;
      }

      if (action === "set-practice-count") {
        const count = Number(target.value);
        if (count === 3 || count === 6) {
          state.practiceCount = count;
          saveSessionState();
          renderApp();
          announce(`每次练习 ${count} 题。`);
        }
        return;
      }

      if (action === "toggle-config") {
        state.configOpen = !state.configOpen;
        saveSessionState();
        renderApp();
        announce(state.configOpen ? "已展开练习设置" : "已收起练习设置");
        return;
      }

      if (action === "start-practice") {
        startNewPractice();
        return;
      }

      if (action === "retry-wrong") {
        retryWrongPractice();
        return;
      }

      if (action === "clear-stats") {
        clearStats();
        renderApp();
        announce("累计练习统计已清空。");
        return;
      }

      if (action === "check-practice") {
        checkPractice();
        return;
      }

      if (action === "reset-practice") {
        resetPractice();
        return;
      }
    }

    elements.appShell.addEventListener("click", (event) => {
      const viewTab = event.target.closest("[data-view]");
      if (viewTab) {
        setView(viewTab.dataset.view);
        return;
      }
      const actionTarget = event.target.closest("[data-action]");
      if (actionTarget) {
        handleAction(actionTarget);
      }
    });

    elements.appShell.addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.action === "choose-answer") {
        const answerKey = target.dataset.questionId || target.dataset.formId;
        state.choices[answerKey] = target.value;
        state.result = null;
        state.answerRevision += 1;
        state.lastCheckedSignature = null;
        saveSessionState();
        return;
      }
      if (target.dataset.action === "type-answer") {
        const answerKey = target.dataset.questionId || target.dataset.formId;
        state.answers[answerKey] = target.value;
        state.result = null;
        state.answerRevision += 1;
        state.lastCheckedSignature = null;
        saveSessionState();
        return;
      }
      if (target.dataset.action === "toggle-hint") {
        if (target.dataset.hint === "kana") {
          state.showKana = target.checked;
        } else if (target.dataset.hint === "meaning") {
          state.showMeaning = target.checked;
        } else {
          return;
        }
        state.result = null;
        state.answerRevision += 1;
        state.lastCheckedSignature = null;
        saveSessionState();
        renderApp();
        announce(`${target.dataset.hint === "kana" ? "假名" : "中文"}提示已${target.checked ? "显示" : "隐藏"}。`);
        return;
      }
      if (target.dataset.action === "set-practice-count") {
        handleAction(target);
      }
    });

    window.addEventListener("popstate", () => {
      readUrlState();
      renderApp();
      announce(`已返回${state.view === "rules" ? "规则讲解" : "练习"}。`);
    });

    /* P3：ESC 关闭主题面板 */
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        document.querySelectorAll(".theme-switcher.is-open").forEach((el) => {
          el.classList.remove("is-open");
        });
        document.querySelectorAll('.theme-switcher-button[aria-expanded="true"]').forEach((btn) => {
          btn.setAttribute("aria-expanded", "false");
        });
      }
    });

    loadSessionState();
    readUrlState();
    window.NihongoTheme.init();
    applyThemeHeadline();
    try {
      validateData();
      writeUrlState(false);
      renderApp();
    } catch (error) {
      elements.appShell.innerHTML = `<div class="data-error"><strong>数据校验失败，页面未初始化。</strong><pre>${error.message}</pre></div>`;
      console.error(error);
    }
  </script>
</body>
</html>
