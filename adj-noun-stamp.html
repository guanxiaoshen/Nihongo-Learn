<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    /* Nihongo-Learn · 主题管理器（共享）
     * 三页统一引入（<head> 内同步执行，避免首屏闪烁）。
     * 用法：NihongoTheme.init() 初始化；NihongoTheme.apply(id) 切换；
     *       NihongoTheme.updateSwitcher() 同步面板选中态（渲染后调用）。
     * 持久化：localStorage "nihongo-learn-theme"（全站共享，三页一致）。
     */
    (function () {
      "use strict";

      var THEME_KEY = "nihongo-learn-theme";
      var DEFAULT_THEME = "aka";
      var THEMES = ["aka", "sumi", "koke", "kon", "fuji"];
      var THEME_LABELS = {
        aka: "印谱・朱红",
        sumi: "墨流・墨青",
        koke: "苔庭・苔绿",
        kon: "蓝染・绀蓝",
        fuji: "藤棚・藤紫"
      };

      function current() {
        try {
          var value = window.localStorage.getItem(THEME_KEY);
          return THEMES.indexOf(value) >= 0 ? value : DEFAULT_THEME;
        } catch (error) {
          return DEFAULT_THEME;
        }
      }

      function apply(themeId) {
        var id = THEMES.indexOf(themeId) >= 0 ? themeId : DEFAULT_THEME;
        document.documentElement.setAttribute("data-theme", id);
        try {
          window.localStorage.setItem(THEME_KEY, id);
        } catch (error) {
          /* 隐私模式等场景静默降级 */
        }
        return id;
      }

      function updateSwitcher() {
        var active = current();
        var options = document.querySelectorAll(".theme-option[data-theme-id]");
        for (var i = 0; i < options.length; i += 1) {
          options[i].setAttribute("aria-pressed", String(options[i].getAttribute("data-theme-id") === active));
        }
        var buttons = document.querySelectorAll(".theme-switcher-button");
        for (var j = 0; j < buttons.length; j += 1) {
          buttons[j].setAttribute("aria-label", "切换主题配色，当前：" + (THEME_LABELS[active] || active));
        }
      }

      function init() {
        apply(current());
      }

      window.NihongoTheme = {
        apply: apply,
        current: current,
        updateSwitcher: updateSwitcher,
        init: init,
        themes: THEMES,
        labels: THEME_LABELS
      };
    })();

  </script>

      color: var(--vermilion-deep);
      background:
        linear-gradient(90deg, rgba(var(--vermilion-rgb), .08), transparent 65%),
        var(--wash);
      cursor: pointer;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 900;
      list-style: none;
    }

    .reference-details summary::-webkit-details-marker {
      display: none;
    }

    .reference-details summary::after {
      color: var(--muted);
      content: "展开查询";
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 800;
    }

    .reference-details[open] summary::after {
      content: "收起查询";
    }

    .reference-details-note {
      color: var(--muted);
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 700;
    }

    .reference-details-body {
      display: grid;
      gap: 12px;
      padding: 12px;
      border-top: 1px solid var(--line-strong);
    }

    /* P3：练习设置折叠 */
    .config-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
    }

    .config-title {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 900;
    }

    .config-toggle {
      padding: 0;
      border: 0;
      color: var(--vermilion-deep);
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 900;
    }

    .config-toggle:hover {
      text-decoration: underline;
    }

    .config-summary {
      margin-left: auto;
      color: var(--muted);
      font-size: .74rem;
    }

    .hint-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .hint-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .hint-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--vermilion);
    }

    .practice-config.is-folded .config-rows {
      display: none;
    }


    .table-scroll {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: auto;
      border: 2px solid var(--vermilion-deep);
      border-radius: 2px;
      background: var(--surface-strong);
      box-shadow: 6px 7px 0 rgba(var(--vermilion-deep-rgb), .08);
      scrollbar-color: var(--vermilion) var(--vermilion-soft);
    }

    .rule-table {
      width: 100%;
      min-width: 1060px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .rule-table th,
    .rule-table td {
      padding: 10px;
      border-width: 0 1px 1px 0;
      border-style: solid;
      border-color: rgba(var(--vermilion-deep-rgb), .28);
      vertical-align: top;
    }

    .rule-table thead tr:first-child > * {
      border-top-width: 1px;
    }

    .rule-table tr > *:first-child {
      border-left-width: 1px;
    }

    .rule-table thead th {
      position: sticky;
      z-index: 5;
      top: 0;
      color: var(--surface-strong);
      background:
        repeating-linear-gradient(45deg, transparent 0 11px, rgba(var(--surface-rgb), .08) 12px 13px, transparent 14px 26px),
        var(--vermilion-deep);
      font-size: .84rem;
      text-align: left;
    }

    .rule-table thead th:first-child {
      left: 0;
      z-index: 8;
      width: 88px;
      min-width: 88px;
      padding: 8px 4px;
      text-align: center;
    }

    .form-header-main {
      display: inline-block;
      font-family: var(--display);
      font-size: .86rem;
      letter-spacing: .05em;
      line-height: 1;
      writing-mode: vertical-rl;
      text-orientation: upright;
      vertical-align: middle;
    }

    .form-header-sub {
      display: inline-block;
      margin: 0 0 0 4px;
      color: rgba(var(--surface-rgb), .72);
      font-family: var(--mono);
      font-size: .56rem;
      font-weight: 700;
      letter-spacing: .12em;
      line-height: 1;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      text-orientation: upright;
      vertical-align: middle;
    }

    .rule-table .form-cell {
      position: sticky;
      left: 0;
      z-index: 4;
      width: 88px;
      min-width: 88px;
      padding: 8px 5px;
      color: var(--vermilion-deep);
      background:
        linear-gradient(145deg, rgba(var(--vermilion-rgb), .06), transparent 72%),
        var(--surface);
      vertical-align: middle;
      text-align: center;
    }

    .form-cell-content {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: 5px 6px;
      height: 162px;
      min-height: 162px;
      padding: 8px 5px;
      border: 2px solid var(--line-strong);
      background:
        repeating-linear-gradient(45deg, transparent 0 10px, rgba(var(--vermilion-rgb), .025) 11px 12px, transparent 13px 24px),
        var(--surface-strong);
      box-shadow: inset 0 0 0 1px var(--line), 3px 3px 0 rgba(var(--vermilion-deep-rgb), .06);
    }

    .form-index {
      display: inline-grid;
      grid-column: 1;
      grid-row: 1;
      width: 27px;
      min-width: 27px;
      height: 27px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--vermilion);
      border-radius: 2px;
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      line-height: 1;
    }

    .rule-table tbody tr:hover > th,
    .rule-table tbody tr:hover > td,
    .rule-table tbody tr:focus-within > th,
    .rule-table tbody tr:focus-within > td {
      background: var(--vermilion-soft);
    }

    .rule-table tr:last-child td,
    .rule-table tr:last-child .form-cell {
      border-bottom: 0;
    }

    .rule-table th:last-child,
    .rule-table td:last-child {
      border-right: 0;
    }

    .form-name {
      display: block;
      grid-column: 2;
      grid-row: 1 / span 2;
      max-width: 100%;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1.1;
      white-space: nowrap;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    .form-jp {
      display: block;
      grid-column: 1;
      grid-row: 2;
      color: var(--accent-muted);
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.1;
      white-space: nowrap;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    .form-cell[data-form-group="derived"] .form-index {
      border-color: var(--line-strong);
      color: var(--accent-muted);
      background: var(--surface);
    }

    .rule-card {
      min-width: 190px;
      height: 162px;
      perspective: none;
      animation: stamp-card-in .5s cubic-bezier(.18, .8, .2, 1) both;
      animation-delay: var(--card-delay, 0ms);
    }

    .rule-card-button {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .rule-card-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
    }

    .rule-card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border: 3px double var(--vermilion);
      border-radius: 2px;
      background:
        repeating-linear-gradient(45deg, transparent 0 10px, rgba(var(--vermilion-rgb), .025) 11px 12px, transparent 13px 24px),
        var(--surface);
      box-shadow: 4px 5px 0 rgba(var(--vermilion-deep-rgb), .08);
      overflow: hidden;
      pointer-events: none;
      transition: opacity .32s ease, transform .38s cubic-bezier(.18, .8, .2, 1), box-shadow .25s ease;
    }

    .rule-card-face::before {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 9px;
      height: 9px;
      border: 1px solid var(--accent-muted);
      content: "";
      transform: rotate(45deg);
    }

    .rule-card-front {
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    .rule-card-back {
      border-color: var(--vermilion-deep);
      color: var(--surface-strong);
      background:
        repeating-linear-gradient(45deg, transparent 0 10px, rgba(var(--surface-rgb), .04) 11px 12px, transparent 13px 24px),
        var(--vermilion);
      opacity: 0;
      transform: scale(.88) rotate(2deg);
    }

    .rule-card.is-flipped .rule-card-front {
      opacity: 0;
      transform: scale(.88) rotate(-2deg);
    }

    .rule-card.is-flipped .rule-card-back {
      opacity: 1;
      transform: scale(1) rotate(-.25deg);
    }

    .rule-card:hover {
      z-index: 7;
    }

    .rule-card:hover .rule-card-front,
    .rule-card:hover .rule-card-back {
      box-shadow: 7px 8px 0 rgba(var(--vermilion-deep-rgb), .12);
    }

    .card-kicker {
      color: var(--vermilion-deep);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .rule-card-back .card-kicker,
    .rule-card-back .card-example-result,
    .rule-card-back .card-example-process,
    .rule-card-back .card-example-meaning,
    .rule-card-back .flip-hint {
      color: var(--surface-strong);
    }

    .card-rule {
      display: block;
      margin: 8px 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: .94rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .card-detail,
    .card-example-process,
    .card-example-meaning {
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.4;
    }

    .card-example {
      display: grid;
      gap: 4px;
      margin-top: auto;
    }

    .card-example-result {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 900;
    }

    /* 振り仮名（ruby）与词干/接续分解 */
    .card-example-result ruby,
    .breakdown ruby {
      ruby-position: over;
    }

    .card-example-result rt {
      font-size: .74rem;
      font-weight: 600;
      color: var(--accent-muted);
    }

    .breakdown {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      color: var(--accent-muted);
      font-size: .74rem;
    }

    .breakdown ruby {
      color: var(--vermilion-deep);
      font-weight: 900;
    }

    .breakdown rt {
      font-size: .74rem;
      font-weight: 600;
      color: var(--accent-muted);
    }

    .breakdown .affix {
      padding: 1px 5px;
      border: 1px dashed var(--line-strong);
      border-radius: 2px;
      color: var(--success);
      background: var(--success-soft);
      font-weight: 800;
    }

    .flip-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 800;
    }

    .flip-hint::before {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      border: 1px solid var(--accent-muted);
      border-radius: 2px;
      color: var(--vermilion-deep);
      background: var(--wash);
      content: "印";
      font-family: var(--display);
      font-size: .74rem;
      font-weight: 900;
    }

    .rule-card-back .flip-hint::before {
      border-color: rgba(var(--surface-rgb), .7);
      color: var(--surface-strong);
      background: transparent;
    }

    .sound-reference {
      display: grid;
      gap: 10px;
      margin-top: 4px;
      padding: 12px 16px 16px;
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--vermilion);
      border-radius: 0 0 2px 2px;
      background: var(--surface);
    }

    .sound-reference h3 {
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1rem;
    }

    .sound-reference > div:first-child p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .sound-summary {
      display: grid;
      gap: 9px;
      padding: 11px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--vermilion);
      border-radius: 2px;
      background: var(--surface-strong);
    }

    .sound-summary-heading {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px 10px;
    }

    .sound-summary-heading strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: .92rem;
    }

    .sound-summary-heading span {
      color: var(--muted);
      font-size: .74rem;
    }

    .sound-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .sound-summary-item {
      display: grid;
      gap: 2px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--wash);
    }

    .sound-summary-item strong {
      color: var(--vermilion-deep);
      font-size: .74rem;
    }

    .sound-summary-item span {
      color: var(--ink);
      font-family: var(--display);
      font-size: .84rem;
      font-weight: 800;
    }

    .sound-summary-note {
      margin: 0;
      color: var(--muted);
      font-size: .74rem;
    }

    .sound-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: .8rem;
    }

    .sound-table th,
    .sound-table td {
      padding: 8px 9px;
      border: 1px solid rgba(var(--vermilion-deep-rgb), .24);
      text-align: center;
    }

    .sound-table th {
      color: var(--vermilion-deep);
      background: var(--surface-strong);
      font-weight: 900;
    }

    .sound-table thead th {
      padding-top: 9px;
      padding-bottom: 9px;
      background:
        linear-gradient(180deg, rgba(var(--vermilion-rgb), .1), transparent),
        var(--surface-strong);
      font-size: .76rem;
      letter-spacing: .03em;
    }

    .sound-table tbody th {
      background: var(--vermilion-soft);
      font-family: var(--display);
      text-align: left;
    }

    .sound-table tbody tr:hover th,
    .sound-table tbody tr:hover td {
      background: var(--wash-hover);
    }

    .exception-callout {
      display: flex;
      align-items: start;
      gap: 9px;
      padding: 10px 12px;
      border: 1px solid var(--vermilion);
      border-radius: 2px;
      color: var(--muted);
      background: var(--surface);
      font-size: .8rem;
    }

    .exception-callout strong {
      color: var(--vermilion-deep);
    }

    .practice-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: var(--wash);
    }

    /* 练习设置区（类型筛选 / 形范围 / 题数） */
    .practice-config {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding: 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-small);
      background: var(--surface-strong);
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .config-label {
      width: 64px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 900;
    }

    .type-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .type-chip {
      padding: 6px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--muted);
      background: var(--wash);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 900;
      transition: border-color .2s ease, color .2s ease, background-color .2s ease;
    }

    .type-chip:hover {
      border-color: var(--vermilion);
    }

    .type-chip[aria-pressed="true"],
    .type-chip.is-active {
      border-color: var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
    }

    .count-select {
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--ink);
      background: var(--surface);
      font-size: .8rem;
      font-weight: 700;
    }

    .start-actions {
      margin-top: 12px;
    }

    .start-actions .primary-button,
    .start-actions .secondary-button {
      padding: 9px 18px;
    }

    .start-actions .secondary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .mode-switch {
      display: flex;
      gap: 5px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface);
    }

    .mode-button {
      padding: 7px 12px;
      border: 2px solid transparent;
      border-radius: 2px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 900;
    }

    .mode-button[aria-pressed="true"] {
      border-color: var(--vermilion);
      color: var(--vermilion-deep);
      background: var(--vermilion-soft);
    }

    .practice-prompt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background:
        linear-gradient(110deg, rgba(var(--vermilion-rgb), .08), transparent 62%),
        var(--surface-strong);
    }

    .practice-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 9px 14px;
    }

    .practice-word strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: .05em;
      line-height: 1;
    }

    .practice-word span {
      color: var(--accent-muted);
      font-size: 1rem;
      font-weight: 900;
    }

    .practice-word small {
      flex-basis: 100%;
      color: var(--muted);
      font-size: .84rem;
    }

    .practice-prompt-side {
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
    }

    .practice-prompt-side strong {
      display: block;
      margin-bottom: 3px;
      color: var(--vermilion-deep);
      font-size: .94rem;
    }

    .practice-group {
      display: grid;
      gap: 10px;
    }

    .practice-group h3 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.15rem;
    }

    .practice-group h3::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .practice-list {
      display: grid;
      gap: 8px;
    }

    .practice-row {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      align-items: start;
      gap: 14px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface-strong);
    }

    .progressive-row {
      grid-template-columns: minmax(180px, .85fr) 150px minmax(0, 1fr);
      align-items: center;
    }

    .progressive-question {
      display: grid;
      gap: 7px;
    }

    .question-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .question-word strong {
      color: var(--vermilion-deep);
      font-family: var(--display);
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .question-word span {
      color: var(--accent-muted);
      font-size: .82rem;
      font-weight: 900;
    }

    .question-word small {
      flex-basis: 100%;
      color: var(--muted);
      font-size: .74rem;
    }

    .sentence-prompt {
      padding: 7px 9px;
      border-left: 3px solid var(--vermilion);
      color: var(--ink);
      background: var(--wash);
      font-family: var(--display);
      font-size: .95rem;
      font-weight: 800;
    }

    .sentence-prompt small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 600;
    }

    .conversion-prompt {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px 8px;
      padding: 7px 9px;
      border-left: 3px solid var(--accent-muted);
      color: var(--muted);
      background: var(--wash);
      font-size: .78rem;
    }

    .conversion-prompt strong {
      color: var(--ink);
      font-family: var(--display);
      font-size: .96rem;
    }

    .conversion-prompt em {
      color: var(--vermilion-deep);
      font-size: 1.1rem;
      font-style: normal;
      font-weight: 900;
    }

    .conversion-prompt small {
      flex-basis: 100%;
      font-size: .72rem;
    }

    .progressive-answer {
      min-width: 0;
    }

    .practice-row.is-correct {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .practice-row.is-wrong {
      border-color: var(--danger);
      background: var(--danger-soft);

<body data-theme="stamp">
  <div class="page">
    <header class="page-heading">
      <div>
        <h1>日语形容词・名词变形表 · 印谱方格</h1>
        <p>以柔和朱红、米白和和纸灰整理い形容词、な形容词与名词的活用。像翻阅印谱一样，先看规则，再翻开卡片确认实例。</p>
      </div>
      <div class="page-heading-mark" aria-hidden="true">印</div>
    </header>
    <main id="app-shell" data-theme="stamp"></main>
    <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="data/adj-noun.js"></script>
  <script src="js/adj-conjugator.js"></script>

  <script>
    "use strict";

    const STORAGE_KEY = "adj-noun-stamp-state-v1";
    const STATS_KEY = "adj-noun-practice-stats-v1";
    const REVIEW_INTERVALS = [5 * 60 * 1000, 60 * 60 * 1000, 24 * 60 * 60 * 1000, 3 * 24 * 60 * 60 * 1000, 7 * 24 * 60 * 60 * 1000];

    const theme = {
      id: "stamp",
      name: "印谱方格"
    };

    /* 主题面板色块固定本色（不随主题变量变化） */
    const THEME_SWATCH_COLORS = {
      aka: "#b9655b",
      sumi: "#55617a",
      koke: "#5d7a52",
      kon: "#41689c",
      fuji: "#8a72ab"
    };

    /* 顶部说明区文案：随主题切换（语境/语气与主题含义一致） */
    const MODULE_TITLE = "日语形容词・名词变形表";
    const THEME_HEADLINE = {
      aka: {
        suffix: "印谱方格",
        desc: "以柔和朱红、米白和和纸灰整理い形容词、な形容词与名词的活用。像翻阅印谱一样，先看规则，再翻开卡片确认实例。",
        edition: "和風 · 印谱六号",
        seal: "印"
      },
      sumi: {
        suffix: "墨流方格",
        desc: "以墨青、宣纸白与淡墨灰整理い形容词、な形容词与名词的活用。像墨流晕染一样，先看规则，再翻开卡片确认实例。",
        edition: "和風 · 墨流六号",
        seal: "墨"
      },
      koke: {
        suffix: "苔庭方格",
        desc: "以苔绿、米黄纸与庭园灰整理い形容词、な形容词与名词的活用。像苔庭沉静一样，先看规则，再翻开卡片确认实例。",
        edition: "和風 · 苔庭六号",
        seal: "苔"
      },
      kon: {
        suffix: "蓝染方格",
        desc: "以绀蓝、淡蓝纸与靛灰整理い形容词、な形容词与名词的活用。像蓝染布纹一样，先看规则，再翻开卡片确认实例。",
        edition: "和風 · 蓝染六号",
        seal: "蓝"
      },
      fuji: {
        suffix: "藤棚方格",
        desc: "以藤紫、淡紫纸与藤灰整理い形容词、な形容词与名词的活用。像藤棚花影一样，先看规则，再翻开卡片确认实例。",
        edition: "和風 · 藤棚六号",
        seal: "藤"
      }
    };

    function getThemeHeadline() {
      return THEME_HEADLINE[window.NihongoTheme.current()] || THEME_HEADLINE.aka;
    }

    /* 同步顶部静态说明区（page-heading 的标题与描述） */
    function applyThemeHeadline() {
      const headline = getThemeHeadline();
      const heading = document.querySelector(".page-heading h1");
      const desc = document.querySelector(".page-heading > div > p");
      if (heading) {
        heading.textContent = `${MODULE_TITLE} · ${headline.suffix}`;
      }
      if (desc) {
        desc.textContent = headline.desc;
      }
      document.querySelectorAll(".edition-note").forEach((el) => {
        el.textContent = headline.edition;
      });
      const seal = document.querySelector(".page-heading-mark");
      if (seal) {
        seal.textContent = headline.seal;
      }
    }

    function renderThemeSwitcher() {
      return `
        <div class="theme-switcher">
          <button class="theme-switcher-button" type="button" data-action="toggle-theme-panel"
            aria-expanded="false" aria-haspopup="true">
            <span class="theme-swatch" style="background: var(--vermilion)"></span>主题
          </button>
          <div class="theme-panel" role="menu" aria-label="选择主题配色">
            ${Object.entries(window.NihongoTheme.labels).map(([id, label]) => `
              <button class="theme-option" type="button" role="menuitemradio" data-action="select-theme" data-theme-id="${id}"
                aria-pressed="${window.NihongoTheme.current() === id}">
                <span class="theme-swatch" style="background: ${THEME_SWATCH_COLORS[id] || "#b9655b"}"></span>${label}
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* ===== 数据层：从 data/adj-noun.js 读取 ===== */
    const adjData = window.NIHONGO_DATA.adjNoun;
    const baseForms = adjData.forms;
    const derivedForms = [];
    const allForms = adjData.forms;
    const typeColumns = adjData.typeColumns;
    const formRules = adjData.formRules;
    const soundRows = adjData.summaryRows;
    const typeExamples = adjData.examples;
    const lexicon = adjData.lexicon;
    const usageExamples = adjData.usageExamples || [];
    const memoryFormulas = adjData.memoryFormulas || [];
    const usageGuides = adjData.usageGuides || [];
    const exceptionMemory = adjData.exceptionMemory || [];
    const sentenceTemplates = adjData.sentenceTemplates || {};
    const MEMORY_FORM_IDS = ["kotei", "hitei", "kako", "kakoHitei", "te", "jouken"];

    const answerSets = {};
    allForms.forEach((form) => {
      answerSets[form.id] = {
        canonical: typeExamples["i-adj"].forms[form.id],
        acceptedAnswers: [typeExamples["i-adj"].forms[form.id]]
      };
    });

    const state = {
      view: "rules",
      practiceMode: "simple",
      activeGroups: { rules: "base", practice: "base" },
      cardFlips: {},
      answers: {},
      choices: {},
      result: null,
      answerRevision: 0,
      lastCheckedSignature: null,
      onlyWrong: false,
      practiceKind: "same",
      showKana: true,
      showMeaning: true,
      /* 练习改造（词库随机抽词） */
      practiceTypes: ["i-adj", "na-adj", "noun"],
      practiceScope: "all",
      practiceCount: 6,
      currentVerb: null,
      currentForms: [],
      currentQuestions: [],
      stats: null,
      configOpen: true,
      referenceOpen: false
    };

    state.stats = loadStats();

    /* 累计练习统计（localStorage 长期保存）：错题集 + 各词/各形正确率 */
    function emptyStats() {
      return { byVerb: {}, byForm: {}, wrongItems: [] };
    }

    function normalizeWrongItems(items) {
      const unique = [];
      items.forEach((item) => {
        if (!item || typeof item !== "object" || !item.dict || !item.formId) {
          return;
        }
        const existing = unique.find((entry) => entry.dict === item.dict && entry.formId === item.formId);
        if (existing) {
          existing.wrongCount += Number(item.wrongCount) || 1;
          existing.lastWrongAt = Math.max(existing.lastWrongAt, Number(item.lastWrongAt) || 0);
        } else {
          unique.push({
            dict: String(item.dict),
            formId: String(item.formId),
            wrongCount: Math.max(1, Number(item.wrongCount) || 1),
            lastWrongAt: Number(item.lastWrongAt) || 0,
            correctStreak: Math.max(0, Number(item.correctStreak) || 0),
            lastCorrectAt: Number(item.lastCorrectAt) || 0,
            dueAt: Number(item.dueAt) || 0
          });
        }
      });
      return unique.slice(-200);
    }

    function loadStats() {
      try {
        const raw = window.localStorage.getItem(STATS_KEY);
        if (!raw) {
          return emptyStats();
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          return emptyStats();
        }
        return {
          byVerb: parsed.byVerb && typeof parsed.byVerb === "object" ? parsed.byVerb : {},
          byForm: parsed.byForm && typeof parsed.byForm === "object" ? parsed.byForm : {},
          wrongItems: Array.isArray(parsed.wrongItems) ? normalizeWrongItems(parsed.wrongItems) : []
        };
      } catch (error) {
        console.error("练习统计读取失败，已重置。", error);
        return emptyStats();
      }
    }

    function saveStats() {
      try {
        window.localStorage.setItem(STATS_KEY, JSON.stringify(state.stats));
      } catch (error) {
        console.warn("练习统计保存失败（可能处于隐私模式）：", error && error.message);
      }
    }

    function clearStats() {
      state.stats = emptyStats();
      saveStats();
    }

    function recordWrongItem(dict, formId) {
      const now = Date.now();
      const existing = state.stats.wrongItems.find((item) => item.dict === dict && item.formId === formId);
      if (existing) {
        existing.wrongCount = (Number(existing.wrongCount) || 0) + 1;
        existing.lastWrongAt = now;
        existing.correctStreak = 0;
        existing.dueAt = existing.lastWrongAt;
      } else {
        state.stats.wrongItems.push({
          dict,
          formId,
          wrongCount: 1,
          lastWrongAt: now,
          correctStreak: 0,
          lastCorrectAt: 0,
          dueAt: now
        });
      }
      if (state.stats.wrongItems.length > 200) {
        state.stats.wrongItems.splice(0, state.stats.wrongItems.length - 200);
      }
    }

    function resolveWrongItem(dict, formId) {
      const index = state.stats.wrongItems.findIndex(
        (item) => item.dict === dict && item.formId === formId
      );
      if (index < 0) {
        return;
      }
      const item = state.stats.wrongItems[index];
      item.correctStreak = (Number(item.correctStreak) || 0) + 1;
      item.lastCorrectAt = Date.now();
      if (item.correctStreak >= 3) {
        state.stats.wrongItems.splice(index, 1);
        return;
      }
      item.dueAt = item.lastCorrectAt + REVIEW_INTERVALS[Math.min(item.correctStreak, REVIEW_INTERVALS.length - 1)];
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    /* 在选定的词类范围内随机抽取一个练习词 */
    function pickPracticeVerb() {
      const pool = lexicon.filter((verb) => state.practiceTypes.includes(verb.type));
      if (pool.length === 0) {
        return null;
      }
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /* 抽取 N 个活用形（形容词/名词模块共 6 形，无分组） */
    function pickPracticeForms(count) {
      const pool = allForms;
      const shuffled = shuffle(pool.map((form) => form.id));
      return shuffled.slice(0, Math.min(count, pool.length));
    }

    /* 构建当前词某个形的可接受答案集（A4：多可接受写法，含 ではない 等价） */
    function buildAcceptedAnswers(formId, forms, kanaForms, stem, verb) {
      const dictForm = forms[formId];
      const kanaForm = kanaForms[formId];
      const set = [dictForm, kanaForm];
      // 剥离括号注音（形容词模块无此场景，保留兼容）
      const stripped = String(dictForm || "").replace(/（[^）]*）/g, "");
      if (stripped && !set.includes(stripped)) {
        set.push(stripped);
      }
      // な形容词/名词：じゃない ↔ ではない、じゃなかった ↔ ではなかった
      if (stem && (formId === "hitei" || formId === "kakoHitei")) {
        const alt = formId === "hitei"
          ? stem.kanji + "ではない"
          : stem.kanji + "ではなかった";
        if (!set.includes(alt)) {
          set.push(alt);
        }
      }
      const variants = verb && verb.acceptedAnswers && Array.isArray(verb.acceptedAnswers[formId])
        ? verb.acceptedAnswers[formId] : [];
      variants.forEach((variant) => {
        if (variant && !set.includes(variant)) {
          set.push(variant);
        }
      });
      return set.filter(Boolean);
    }

    function getCurrentVerbData() {
      if (!state.currentVerb) {
        return null;
      }
      return window.NIHONGO_DATA["adj-conjugator"].conjugate(state.currentVerb);
    }

    /* A3：简易模式干扰项 = 同一词条的其他变形（不足时用全局答案池补位） */
    function getOptions(verb, formId) {
      const data = window.NIHONGO_DATA["adj-conjugator"].conjugate(verb);
      const expected = data.forms[formId];
      const distractors = [...new Set(
        window.NIHONGO_DATA["adj-conjugator"].formIds
          .filter((id) => id !== formId)
          .map((id) => data.forms[id])
          .filter((value) => value !== expected)
      )];
      if (distractors.length < 3) {
        // 同词形不足（极少见）：从全局答案池补位
        const allValues = [...new Set(allForms.map((form) => answerSets[form.id].canonical))];
        allValues.forEach((value) => {
          if (distractors.length >= 3) {
            return;
          }
          if (value !== expected && !distractors.includes(value)) {
            distractors.push(value);
          }
        });
      }
      const picked = shuffle(distractors).slice(0, 3);
      return shuffle([expected, ...picked]);
    }

    const PRACTICE_KIND_LABELS = {
      same: "同词多形",
      mixed: "混合词条",
      sentence: "句子填空",
      classify: "词类判断",
      polite: "普通／礼貌体"
    };
    const PRACTICE_KIND_DESCRIPTIONS = {
      same: "一个词连续练多个变形",
      mixed: "每题随机换词和变形",
      sentence: "根据句子语境填写变形",
      classify: "先判断词属于哪一类",
      polite: "在普通谓语和です体之间切换"
    };

    function getPracticeKindLabel(kind) {
      return PRACTICE_KIND_LABELS[kind] || PRACTICE_KIND_LABELS.same;
    }

    function getPracticeFormPool() {
      return allForms;
    }

    function getTypeAnswers(typeId) {
      const type = typeColumns.find((column) => column.id === typeId);
      if (!type) {
        return [typeId];
      }
      return [typeId, type.label];
    }

    function createProgressiveQuestions(kind, count) {
      const verbPool = lexicon.filter((verb) => state.practiceTypes.includes(verb.type));
      if (!verbPool.length) {
        return [];
      }
      const formPool = getPracticeFormPool();
      if (kind !== "classify" && kind !== "polite" && !formPool.length) {
        return [];
      }
      const questions = [];
      const used = new Set();
      const maxQuestions = Math.min(count, kind === "classify" || kind === "polite"
        ? verbPool.length : formPool.length * verbPool.length);
      let attempts = 0;
      while (questions.length < maxQuestions && attempts < maxQuestions * 12) {
        attempts += 1;
        const verb = verbPool[Math.floor(Math.random() * verbPool.length)];
        const form = kind === "classify" || kind === "polite"
          ? null : formPool[Math.floor(Math.random() * formPool.length)];
        const sourceMode = kind === "polite"
          ? (Math.random() < .5 ? "plain" : "polite") : null;
        const targetMode = kind === "polite"
          ? (sourceMode === "plain" ? "polite" : "plain") : null;
        const key = `${verb.dictionary}:${kind}:${form ? form.id : (targetMode || "type")}`;
        if (used.has(key) && used.size < verbPool.length * (kind === "classify" || kind === "polite" ? 1 : formPool.length)) {
          continue;
        }
        used.add(key);
        questions.push({
          id: `q-${Date.now()}-${questions.length}`,
          dictionary: verb.dictionary,
          formId: form ? form.id : null,
          sourceMode,
          targetMode,
          kind
        });
      }
      return questions;
    }

    function getProgressiveItems() {
      return state.currentQuestions.map((question, index) => {
        const verb = lexicon.find((entry) => entry.dictionary === question.dictionary);
        if (!verb) {
          return null;
        }
        const data = window.NIHONGO_DATA["adj-conjugator"].conjugate(verb);
        const kind = question.kind === "classify" ? "classify" : (question.kind || state.practiceKind);
        const form = question.formId ? getForm(question.formId) : null;
        if (kind !== "classify" && kind !== "polite" && !form) {
          return null;
        }
        const plainValue = data.forms.kotei;
        const plainKana = data.kanaForms.kotei;
        const politeValue = verb.type === "i-adj"
          ? `${plainValue}です` : `${verb.dictionary}です`;
        const politeKana = verb.type === "i-adj"
          ? `${plainKana}です` : `${verb.kana}です`;
        const isPolite = kind === "polite" && question.targetMode === "polite";
        const accepted = kind === "classify"
          ? getTypeAnswers(verb.type)
          : kind === "polite"
            ? [isPolite ? politeValue : plainValue, isPolite ? politeKana : plainKana]
          : buildAcceptedAnswers(form.id, data.forms, data.kanaForms, data.stem, verb);
        const template = kind === "sentence" && form
          ? (sentenceTemplates[verb.type] || {})[form.id] : null;
        return {
          id: question.id || `q-${index}-${verb.dictionary}-${question.formId || "type"}`,
          kind,
          verb,
          data,
          form,
          sourceValue: kind === "polite"
            ? (question.sourceMode === "polite" ? politeValue : plainValue) : "",
          sourceLabel: kind === "polite"
            ? (question.sourceMode === "polite" ? "礼貌体" : "普通体") : "",
          targetLabel: kind === "polite"
            ? (isPolite ? "礼貌体" : "普通体") : "",
          formKey: kind === "polite" ? "__polite__" : (form ? form.id : "__type__"),
          accepted,
          template
        };
      }).filter(Boolean);
    }

    function getPoliteOptions(item) {
      return shuffle([...new Set([
        item.accepted[0],
        item.sourceValue,
        item.data.forms.hitei,
        item.data.forms.kako,
        item.data.forms.te
      ].filter(Boolean))]).slice(0, 4);
    }

    const elements = {
      appShell: document.getElementById("app-shell"),
      liveRegion: document.getElementById("live-region")
    };

    function loadSessionState() {
      const rawState = sessionStorage.getItem(STORAGE_KEY);
      if (!rawState) {
        return;
      }

      let stored;
      try {
        stored = JSON.parse(rawState);
      } catch (error) {
        console.error("印谱页临时状态解析失败，已清理损坏状态。", error);
        sessionStorage.removeItem(STORAGE_KEY);
        return;
      }

      if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
        console.error("印谱页临时状态格式无效，已清理损坏状态。");
        sessionStorage.removeItem(STORAGE_KEY);
        return;
      }

      if (stored.activeGroups && typeof stored.activeGroups === "object") {
        if (stored.activeGroups.rules === "base" || stored.activeGroups.rules === "derived") {
          state.activeGroups.rules = stored.activeGroups.rules;
        }
        if (stored.activeGroups.practice === "base" || stored.activeGroups.practice === "derived") {
          state.activeGroups.practice = stored.activeGroups.practice;
        }
      }
      if (stored.practiceMode === "simple" || stored.practiceMode === "standard") {
        state.practiceMode = stored.practiceMode;
      }
      if (stored.cardFlips && typeof stored.cardFlips === "object") {
        state.cardFlips = stored.cardFlips;
      }
      if (stored.answers && typeof stored.answers === "object") {
        state.answers = stored.answers;
      }
      if (stored.choices && typeof stored.choices === "object") {
        state.choices = stored.choices;
      }
      if (stored.result && typeof stored.result === "object") {
        state.result = stored.result;
      }
      if (Number.isInteger(stored.answerRevision) && stored.answerRevision >= 0) {
        state.answerRevision = stored.answerRevision;
      }
      if (typeof stored.lastCheckedSignature === "string") {
        state.lastCheckedSignature = stored.lastCheckedSignature;
      }
      state.onlyWrong = stored.onlyWrong === true;
      if (["same", "mixed", "sentence", "classify", "polite"].includes(stored.practiceKind)) {
        state.practiceKind = stored.practiceKind;
      }
      state.showKana = stored.showKana !== false;
      state.showMeaning = stored.showMeaning !== false;
      if (Array.isArray(stored.practiceTypes) && stored.practiceTypes.length > 0) {
        const validTypes = stored.practiceTypes.filter((type) => typeColumns.some((column) => column.id === type));
        if (validTypes.length > 0) {
          state.practiceTypes = validTypes;
        }
      }
      if (stored.practiceScope === "base" || stored.practiceScope === "derived" || stored.practiceScope === "all") {
        state.practiceScope = stored.practiceScope;
      }
      if (Number(stored.practiceCount) === 3 || Number(stored.practiceCount) === 6) {
        state.practiceCount = Number(stored.practiceCount);
      }
      if (stored.currentVerb && stored.currentVerb.dictionary && stored.currentVerb.kana && stored.currentVerb.type) {
        const found = lexicon.find((verb) => verb.dictionary === stored.currentVerb.dictionary);
        if (found) {
          state.currentVerb = found;
        }
      }
      state.configOpen = stored.configOpen !== false;
      state.referenceOpen = stored.referenceOpen === true;
      if (Array.isArray(stored.currentForms)) {
        state.currentForms = stored.currentForms.filter((id) => allForms.some((form) => form.id === id));
      }
      if (Array.isArray(stored.currentQuestions)) {
        state.currentQuestions = stored.currentQuestions.filter((question) => {
          if (!question || !question.dictionary || !lexicon.some((verb) => verb.dictionary === question.dictionary)) {
            return false;
          }
          return question.kind === "classify" || question.kind === "polite"
            || allForms.some((form) => form.id === question.formId);
        }).map((question, index) => ({
          id: typeof question.id === "string" && question.id ? question.id : `q-${index}`,
          dictionary: question.dictionary,
          formId: question.kind === "classify" ? null : question.formId,
          sourceMode: question.sourceMode === "plain" || question.sourceMode === "polite" ? question.sourceMode : null,
          targetMode: question.targetMode === "plain" || question.targetMode === "polite" ? question.targetMode : null,
          kind: ["classify", "polite", "mixed", "sentence"].includes(question.kind)
            ? question.kind : state.practiceKind
        }));
      }
    }

    function saveSessionState() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        activeGroups: state.activeGroups,
        practiceMode: state.practiceMode,
        cardFlips: state.cardFlips,
        answers: state.answers,
        choices: state.choices,
        result: state.result,
        answerRevision: state.answerRevision,
        lastCheckedSignature: state.lastCheckedSignature,
        onlyWrong: state.onlyWrong,
        practiceKind: state.practiceKind,
        showKana: state.showKana,
        showMeaning: state.showMeaning,
        practiceTypes: state.practiceTypes,
        practiceScope: state.practiceScope,
        practiceCount: state.practiceCount,
        currentVerb: state.currentVerb,
        currentForms: state.currentForms,
        currentQuestions: state.currentQuestions,
        configOpen: state.configOpen,
        referenceOpen: state.referenceOpen
      }));
    }

    function readUrlState() {
      const params = new URLSearchParams(window.location.search);
      state.view = params.get("view") === "practice" ? "practice" : "rules";
    }

    function writeUrlState(addHistory) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("view", state.view);
        const method = addHistory ? "pushState" : "replaceState";
        window.history[method]({ view: state.view }, "", url);
      } catch (error) {
        // file:// 双击打开或受限环境可能禁止修改历史记录：静默降级，仅保留内存状态
        console.warn("无法更新地址栏状态：", error && error.message);
      }
    }

    function announce(message) {
      elements.liveRegion.textContent = "";
      window.setTimeout(() => {
        elements.liveRegion.textContent = message;
      }, 20);
    }

    function validateData() {
      const errors = [];
      const formIds = new Set(allForms.map((form) => form.id));

      allForms.forEach((form) => {
        if (!form.label || !form.jp || !form.note) {
          errors.push(`${form.id}: 缺少名称、假名或说明`);
        }
        if (!answerSets[form.id]) {
          errors.push(`${form.id}: 缺少练习答案`);
        }
        if (!formRules[form.id]) {
          errors.push(`${form.id}: 缺少规则`);
        }
        typeColumns.forEach((type) => {
          if (!formRules[form.id] || !formRules[form.id][type.id]) {
            errors.push(`${form.id}/${type.id}: 缺少类型规则`);
          }
          if (!typeExamples[type.id].forms[form.id]) {
            errors.push(`${type.id}/${form.id}: 缺少示例`);
          }
        });
      });

      Object.entries(answerSets).forEach(([formId, answer]) => {
        if (!formIds.has(formId) || !answer.canonical || !answer.acceptedAnswers.includes(answer.canonical)) {
          errors.push(`${formId}: 答案集合无效`);
        }
      });

      typeColumns.forEach((type) => {
        allForms.forEach((form) => {
          const template = sentenceTemplates[type.id] && sentenceTemplates[type.id][form.id];
          if (!template || typeof template.prefix !== "string" || typeof template.suffix !== "string") {
            errors.push(`${type.id}/${form.id}: 句子填空模板无效`);
          }
        });
      });

      if (errors.length > 0) {
        throw new Error(errors.join("\n"));
      }
    }

    function getActiveGroup(scope) {
      return state.activeGroups[scope] === "derived" ? "derived" : "base";
    }

    function getFormsForGroup(groupId) {
      return groupId === "derived" ? derivedForms : baseForms;
    }

    function getForm(formId) {
      return allForms.find((form) => form.id === formId);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* B3：卡片背面的振り仮名（<ruby>）与词干/接续分解 */
    function buildExampleDetail(example, typeId, formId) {
      const data = window.NIHONGO_DATA["adj-conjugator"].conjugate({
        dictionary: example.dictionary,
        kana: example.kana,
        meaning: example.meaning,
        type: typeId
      });
      const formValue = data.forms[formId];
      const stem = data.stem;
      if (!stem) {
        return { ruby: escapeHtml(formValue), breakdown: "" };
      }
      const index = formValue.indexOf(stem.kanji);
      if (index < 0) {
        return { ruby: escapeHtml(formValue), breakdown: "" };
      }
      const head = formValue.slice(0, index);
      const tail = formValue.slice(index + stem.kanji.length);
      const stemRuby = `<ruby>${escapeHtml(stem.kanji)}<rt>${escapeHtml(stem.kana)}</rt></ruby>`;
      const breakdown = index === 0
        ? `<span class="breakdown">${stemRuby}<span class="affix">＋ ${escapeHtml(tail)}</span></span>`
        : `<span class="breakdown">${escapeHtml(head)}${stemRuby}<span class="affix">＋ ${escapeHtml(tail)}</span></span>`;
      return { ruby: `${escapeHtml(head)}${stemRuby}${escapeHtml(tail)}`, breakdown };
    }

    function getProcess(typeId, formId, result) {
      const example = typeExamples[typeId];
      const root = `${example.dictionary}（${example.kana}）`;
      if (typeId === "godan" && (formId === "te" || formId === "ta")) {
        return `${root} → く音便 → ${result}`;
      }
      if (typeId === "ichidan") {
        return `${root} → 去「る」 → ${result}`;
      }
      return `${root} → ${result}`;
    }

    function getRuleCard(typeId, formId) {
      const form = getForm(formId);
      const type = typeColumns.find((column) => column.id === typeId);
      const example = typeExamples[typeId];
      const result = example.forms[formId];
      const cardId = `${typeId}-${formId}`;
      const cardIndex = allForms.findIndex((item) => item.id === formId) * typeColumns.length
        + typeColumns.findIndex((item) => item.id === typeId);
      const cardDelay = Math.min(cardIndex * 8, 380);
      const flipped = state.cardFlips[cardId] === true;
      const exception = typeId === "godan" && formId === "te";
      const detail = buildExampleDetail(example, typeId, formId);
      return `
        <div class="rule-card ${flipped ? "is-flipped" : ""}" data-card-id="${cardId}" style="--card-delay: ${cardDelay}ms">
          <button class="rule-card-button" type="button" data-action="flip-card"
            aria-expanded="${flipped}" aria-label="${flipped ? "收起" : "查看"}${type.label}${form.label}示例">
            <span class="rule-card-inner">
              <span class="rule-card-face rule-card-front">
                <span>
                  <span class="card-kicker">${type.label} · 规则</span>
                  <strong class="card-rule">${formRules[formId][typeId]}</strong>
                  <span class="card-detail">${form.note}</span>
                </span>
                <span class="flip-hint">点击查看示例</span>
              </span>
              <span class="rule-card-face rule-card-back">
                <span>
                  <span class="card-kicker">${exception ? "例外提示 · て形" : "代表示例"}</span>
                  <span class="card-example">
                    <span class="card-example-result">${detail.ruby}</span>
                    <span class="card-example-process">${detail.breakdown || getProcess(typeId, formId, result)}</span>
                    <span class="card-example-meaning">${example.dictionary}：${example.meaning}</span>
                  </span>
                </span>
                <span class="flip-hint">${exception ? "く→いて；行く为特殊例外" : "点击翻回规则"}</span>
              </span>
            </span>
          </button>
        </div>
      `;
    }

    function renderRuleTable(forms) {
      return `
        <div class="table-scroll">
          <table class="rule-table">
            <caption class="visually-hidden">活用形与词类变化规则。点击卡片查看代表示例。</caption>
            <thead>
              <tr>
                <th class="form-header" scope="col">
                  <span class="form-header-main">活用形</span>
                  <small class="form-header-sub">FORM</small>
                </th>
                ${typeColumns.map((type) => `<th scope="col">${type.label}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${forms.map((form) => `
                <tr>
                  <th class="form-cell" data-form-group="base" scope="row">
                    <div class="form-cell-content">
                      <span class="form-index" aria-hidden="true">${String(allForms.findIndex((item) => item.id === form.id) + 1).padStart(2, "0")}</span>
                      <span class="form-name">${form.label}</span>
                      <span class="form-jp">${form.jp}</span>
                    </div>
                  </th>
                  ${typeColumns.map((type) => `<td>${getRuleCard(type.id, form.id)}</td>`).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderAdjMemoryParts(typeId, formId) {
      const example = typeExamples[typeId];
      const result = example.forms[formId];
      if (typeId === "i-adj") {
        const stem = example.dictionary.slice(0, -1);
        const parts = {
          kotei: [{ className: "is-root", value: stem }, { className: "is-change", value: "い" }],
          hitei: [{ className: "is-root", value: stem }, { className: "is-change", value: "く" }, { className: "is-suffix", value: "ない" }],
          kako: [{ className: "is-root", value: stem }, { className: "is-change", value: "かった" }],
          kakoHitei: [{ className: "is-root", value: stem }, { className: "is-change", value: "く" }, { className: "is-suffix", value: "なかった" }],
          te: [{ className: "is-root", value: stem }, { className: "is-change", value: "くて" }],
          jouken: [{ className: "is-root", value: stem }, { className: "is-change", value: "ければ" }]
        };
        return (parts[formId] || [{ className: "is-change", value: result }])
          .map((part) => `<span class="adj-token ${part.className}">${escapeHtml(part.value)}</span>`)
          .join("");
      }
      const suffix = result.indexOf(example.dictionary) === 0
        ? result.slice(example.dictionary.length) : result;
      return `
        <span class="adj-token is-root">${escapeHtml(example.dictionary)}</span>
        ${suffix ? `<span class="adj-token is-suffix">${escapeHtml(suffix)}</span>` : ""}
      `;
    }

    function renderAdjMemoryOverview() {
      const formulaCards = memoryFormulas.map((formula) => `
        <article class="adj-formula-card">
          <div class="adj-formula-card-head">
            <h4>${escapeHtml(formula.label)}</h4>
            <span class="adj-formula-card-badge">${escapeHtml(formula.badge)}</span>
          </div>
          <strong class="adj-formula-rule">${escapeHtml(formula.formula)}</strong>
          <span class="adj-formula-note">${escapeHtml(formula.note)}</span>
          <span class="adj-formula-example">${escapeHtml(formula.example)}</span>
        </article>
      `).join("");
      const predicateCards = typeColumns.map((type) => {
        const example = typeExamples[type.id];
        const rows = MEMORY_FORM_IDS.map((formId) => {
          const form = getForm(formId);
          return `
            <div class="adj-predicate-row">
              <span class="adj-predicate-label">${escapeHtml(form ? form.label : formId)}</span>
              <strong class="adj-predicate-result" aria-label="${escapeHtml(example.forms[formId])}">
                ${renderAdjMemoryParts(type.id, formId)}
              </strong>
            </div>
          `;
        }).join("");
        return `
          <article class="adj-predicate-card">
            <div class="adj-predicate-card-head">
              <strong>${escapeHtml(type.label)}</strong>
              <span>${escapeHtml(example.dictionary)} · ${escapeHtml(example.kana)}</span>
            </div>
            <div class="adj-predicate-list" aria-label="${escapeHtml(type.label)}六种谓语变化">
              ${rows}
            </div>
          </article>
        `;
      }).join("");
      return `
        <section class="adj-memory-overview" aria-labelledby="adj-memory-title">

    function normalizeAnswer(value) {
      return String(value || "").trim().normalize("NFKC");
    }

    /* 当前练习的题目列表；旧的同词多形会话继续使用 currentVerb/currentForms */
    function getPracticeItems() {
      if (state.currentQuestions.length) {
        return getProgressiveItems();
      }
      if (!state.currentVerb || !state.currentForms.length) {
        return [];
      }
      const data = getCurrentVerbData();
      const byId = {};
      allForms.forEach((form) => {
        byId[form.id] = form;
      });
      return state.currentForms.map((id) => ({
        form: byId[id],
        accepted: buildAcceptedAnswers(id, data.forms, data.kanaForms, data.stem, state.currentVerb)
      }));
    }

    /* A6：开始新练习 = 随机词条 + 随机 N 形 */
    function startNewPractice() {
      if (state.practiceKind !== "same") {
        const questions = createProgressiveQuestions(state.practiceKind, state.practiceCount);
        if (!questions.length) {
          announce("当前筛选下无法生成题目，请调整词类范围。");
          return;
        }
        state.currentVerb = null;
        state.currentForms = [];
        state.currentQuestions = questions;
        state.answers = {};
        state.choices = {};
        state.result = null;
        state.answerRevision = 0;
        state.lastCheckedSignature = null;
        state.onlyWrong = false;
        saveSessionState();
        renderApp();
        announce(`已开始${getPracticeKindLabel(state.practiceKind)}：共 ${questions.length} 题。`);
        return;
      }
      const verb = pickPracticeVerb();
      if (!verb) {
        announce("当前筛选下没有可选词条，请调整词类范围。");
        return;
      }
      state.currentVerb = verb;
      state.currentForms = pickPracticeForms(state.practiceCount);
      state.currentQuestions = [];
      state.answers = {};
      state.choices = {};
      state.result = null;
      state.answerRevision = 0;
      state.lastCheckedSignature = null;
      state.onlyWrong = false;
      saveSessionState();
      renderApp();
      announce(`已抽取新练习：${verb.dictionary}（${verb.kana}），共 ${state.currentForms.length} 个活用形。`);
    }

    /* 错题再练：从累计错题集随机选一个词条，取它的错形 */
    function retryWrongPractice() {
      const allWrongs = state.stats.wrongItems.filter(
        (w) => w && w.dict && w.formId
          && lexicon.some((v) => v.dictionary === w.dict)
          && (w.formId === "__type__" || w.formId === "__polite__" || allForms.some((form) => form.id === w.formId))
      );
      if (!allWrongs.length) {
        announce("暂无错题记录，先做一组练习吧。");
        return;
      }
      const dueWrongs = allWrongs.filter((w) => !w.dueAt || w.dueAt <= Date.now());
      const wrongs = (dueWrongs.length ? dueWrongs : allWrongs.slice().sort(
        (a, b) => (Number(a.dueAt) || 0) - (Number(b.dueAt) || 0)
      ));
      const byVerb = {};
      wrongs.forEach((w) => {
        if (!byVerb[w.dict]) {
          byVerb[w.dict] = [];
        }
        if (!byVerb[w.dict].includes(w.formId)) {
          byVerb[w.dict].push(w.formId);
        }
      });
      const dicts = Object.keys(byVerb);
      const dict = dicts[Math.floor(Math.random() * dicts.length)];
      const verb = lexicon.find((v) => v.dictionary === dict);
      const selectedWrongForms = shuffle(byVerb[dict]).slice(0, state.practiceCount);
      const hasSpecialQuestions = selectedWrongForms.some((formId) => formId === "__type__" || formId === "__polite__");
      if (hasSpecialQuestions) {
        const allClassify = selectedWrongForms.every((formId) => formId === "__type__");
        const allPolite = selectedWrongForms.every((formId) => formId === "__polite__");
        state.practiceKind = allClassify ? "classify" : allPolite ? "polite" : "mixed";
        state.currentVerb = null;
        state.currentForms = [];
        state.currentQuestions = selectedWrongForms.map((formId, index) => {
          const sourceMode = formId === "__polite__"
            ? (Math.random() < .5 ? "plain" : "polite") : null;
          return {
            id: `q-${Date.now()}-${index}`,
            dictionary: dict,
            formId: formId === "__type__" || formId === "__polite__" ? null : formId,
            sourceMode,
            targetMode: formId === "__polite__"
              ? (sourceMode === "plain" ? "polite" : "plain") : null,
            kind: formId === "__type__" ? "classify" : formId === "__polite__" ? "polite" : "mixed"
          };
        });
      } else {
        state.practiceKind = "same";
        state.currentVerb = verb;
        state.currentForms = selectedWrongForms;
        state.currentQuestions = [];
      }
      state.answers = {};
      state.choices = {};
      state.result = null;
      state.answerRevision = 0;
      state.lastCheckedSignature = null;
      state.onlyWrong = true;
      saveSessionState();
      renderApp();
      announce(`错题再练：${verb.dictionary}，共 ${state.currentQuestions.length || state.currentForms.length} 个待复习题。`);
    }

    function renderQuestionWord(verb) {
      return `
        <div class="question-word">
          <strong>${escapeHtml(verb.dictionary)}</strong>
          ${state.showKana ? `<span>${escapeHtml(verb.kana)}</span>` : ""}
          ${state.showMeaning ? `<small>中文：${escapeHtml(verb.meaning)}</small>` : ""}
        </div>
      `;
    }

    function renderProgressiveRow(item) {
      const resultItem = state.result && state.result.items[item.id]
        ? state.result.items[item.id] : null;
      const rowClass = resultItem ? (resultItem.correct ? "is-correct" : "is-wrong") : "";
      const title = item.kind === "classify"
        ? "判断词类" : item.kind === "polite" ? item.targetLabel : item.form.label;
      const description = item.kind === "classify"
        ? "先判断这个词属于哪一类。"
        : item.kind === "polite" ? `把${item.sourceLabel}转换为${item.targetLabel}。` : item.form.note;
      const answerOptions = item.kind === "classify"
        ? typeColumns.map((type) => ({ value: type.id, label: type.label }))
        : item.kind === "polite"
          ? getPoliteOptions(item).map((value) => ({ value, label: value }))
        : getOptions(item.verb, item.form.id).map((value) => ({ value, label: value }));
      const selected = state.choices[item.id] || "";
      const sentence = item.template
        ? `${item.template.prefix}＿＿${item.template.suffix}` : "";
      const label = `
        <div class="practice-row-label">
          <strong>${title}</strong>
          ${item.form ? `<span>${item.form.jp}</span>` : ""}
          <small>${description}</small>
        </div>
      `;

      const answer = state.practiceMode === "simple"
        ? `
          <fieldset class="choice-grid ${item.kind === "classify" ? "type-choice-grid" : ""}">
            <legend class="visually-hidden">${title}选择题</legend>
            ${answerOptions.map((option, index) => `
              <label class="choice-option">
                <input type="radio" name="choice-${escapeHtml(item.id)}" value="${escapeHtml(option.value)}"
                  ${selected === option.value ? "checked" : ""} data-action="choose-answer"
                  data-question-id="${escapeHtml(item.id)}">
                <span>${escapeHtml(option.label)}</span><em>${String.fromCharCode(65 + index)}</em>
              </label>
            `).join("")}
          </fieldset>
        `
        : `
          <label class="visually-hidden" for="answer-${escapeHtml(item.id)}">${title}答案</label>
          <input id="answer-${escapeHtml(item.id)}" class="answer-field" type="text" inputmode="text"
            autocomplete="off" placeholder="${item.kind === "classify" ? "输入词类，如い形容词" : `输入${title}结果`}"
            value="${escapeHtml(state.answers[item.id] || "")}"
            data-action="type-answer" data-question-id="${escapeHtml(item.id)}">
        `;
      return `
        <article class="practice-row progressive-row ${rowClass}" data-question-id="${escapeHtml(item.id)}">
          <div class="progressive-question">
            ${renderQuestionWord(item.verb)}
            ${item.kind === "polite" ? `
              <div class="conversion-prompt">
                <span>${escapeHtml(item.sourceLabel)}</span>
                <strong>${escapeHtml(item.sourceValue)}</strong>
                <span>→</span><em>?</em>
                <small>目标：${escapeHtml(item.targetLabel)}</small>
              </div>
            ` : ""}
            ${item.kind === "sentence" && item.template ? `
              <div class="sentence-prompt">
                <div>${escapeHtml(sentence)}</div>
                <small>${escapeHtml(item.template.translation)}</small>
              </div>
            ` : ""}
          </div>
          ${label}
          <div class="progressive-answer">${answer}</div>
        </article>
      `;
    }

    function renderPracticeRow(form) {
      const resultItem = state.result && state.result.items[form.id]
        ? state.result.items[form.id] : null;
      const rowClass = resultItem ? (resultItem.correct ? "is-correct" : "is-wrong") : "";
      const label = `
        <div class="practice-row-label">
          <strong>${form.label}</strong>
          <span>${form.jp}</span>
          <small>${form.note}</small>
        </div>
      `;

      if (state.practiceMode === "simple") {
        const selected = state.choices[form.id] || "";
        return `
          <article class="practice-row ${rowClass}" data-form-id="${form.id}">
            ${label}
            <fieldset class="choice-grid">
              <legend class="visually-hidden">${form.label}选择题</legend>
              ${getOptions(state.currentVerb, form.id).map((option, index) => `
                <label class="choice-option">
                  <input type="radio" name="choice-${form.id}" value="${option}"
                    ${selected === option ? "checked" : ""} data-action="choose-answer" data-form-id="${form.id}">
                  <span>${option}</span><em>${String.fromCharCode(65 + index)}</em>
                </label>
              `).join("")}
            </fieldset>
          </article>
        `;
      }

      return `
        <article class="practice-row ${rowClass}" data-form-id="${form.id}">
          ${label}
          <div>
            <label class="visually-hidden" for="answer-${form.id}">${form.label}答案</label>
            <input id="answer-${form.id}" class="answer-field" type="text" inputmode="text"
              autocomplete="off" placeholder="输入${form.label}结果" value="${state.answers[form.id] || ""}"
              data-action="type-answer" data-form-id="${form.id}">
          </div>
        </article>
      `;
    }

    function getProgressiveResultSummary(items) {
      const resultItems = items.map((item) => state.result.items[item.id]).filter(Boolean);
      const correct = resultItems.filter((item) => item.correct).length;
      const total = resultItems.length;
      const percentage = total === 0 ? 0 : Math.round((correct / total) * 100);
      const wrongItems = items.filter((item) => state.result.items[item.id] && !state.result.items[item.id].correct);
      return `
        <section class="result-summary" aria-labelledby="result-title">
          <div class="score-bubble">${percentage}%<span>${correct}/${total}</span></div>
          <div>
            <h3 id="result-title">检查完成</h3>
            <p>本次${getPracticeKindLabel(state.practiceKind)}共 ${total} 题，答对 ${correct} 题。${wrongItems.length ? "错题已加入复习队列。" : "本次全部答对，可以继续提高难度。"}</p>
            ${wrongItems.length > 0 ? `
              <div class="result-items">
                ${wrongItems.map((item) => {
                  const expected = item.kind === "classify"
                    ? typeColumns.find((type) => type.id === item.verb.type).label
                    : item.kind === "polite" ? item.accepted[0] : item.data.forms[item.form.id];
                  return `
                    <div class="result-item is-wrong">
                      <strong>${escapeHtml(item.verb.dictionary)}</strong>
                      <span>${escapeHtml(item.kind === "classify" ? "词类" : item.kind === "polite" ? item.targetLabel : item.form.label)}</span>
                      <small>${escapeHtml(expected)}</small>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `
              <div class="exception-callout"><span aria-hidden="true">✓</span><span><strong>全部答对！</strong>可以切换到更少提示或句子练习。</span></div>
            `}
          </div>
        </section>
      `;
    }

    function getResultSummary() {
      if (!state.result) {
        return "";
      }
      if (state.currentQuestions.length) {
        return getProgressiveResultSummary(getProgressiveItems());
      }
      if (!state.currentVerb) {
        return "";
      }
      const items = Object.values(state.result.items);
      const correct = items.filter((item) => item.correct).length;
      const total = items.length;
      const percentage = total === 0 ? 0 : Math.round((correct / total) * 100);
      const verbStats = state.stats.byVerb[state.currentVerb.dictionary];
      const allAttempts = Object.values(state.stats.byForm).reduce((sum, s) => sum + s.t, 0);
      const allCorrect = Object.values(state.stats.byForm).reduce((sum, s) => sum + s.c, 0);
      const allPct = allAttempts === 0 ? null : Math.round((allCorrect / allAttempts) * 100);
      const data = getCurrentVerbData();
      const wrongList = Object.entries(state.result.items)
        .filter(([, item]) => !item.correct);
      return `
        <section class="result-summary" aria-labelledby="result-title">
          <div class="score-bubble">${percentage}%<span>${correct}/${total}</span></div>
          <div>
            <h3 id="result-title">检查完成</h3>
            <p>本次：<strong>${state.currentVerb.dictionary}</strong>（${state.currentVerb.kana}）的 ${total} 个形，答对 ${correct} 个。
              ${verbStats ? `该词累计 ${verbStats.t} 次，正确率 ${Math.round((verbStats.c / verbStats.t) * 100)}%。` : ""}
              ${allPct !== null ? `全部形累计 ${allAttempts} 次，正确率 ${allPct}%。` : ""}
            </p>
            ${wrongList.length > 0 ? `
              <div class="result-items">
                ${wrongList.map(([formId]) => {
                  const form = getForm(formId);
                  return `
                    <div class="result-item is-wrong">
                      <strong>${form.label}</strong>
                      <span>需复习</span>
                      <small>${data.forms[formId]}</small>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `
              <div class="exception-callout"><span aria-hidden="true">✓</span><span><strong>全部答对！</strong>可以再抽一组巩固，或查看错题集继续。</span></div>
            `}
          </div>
        </section>
      `;
    }

    function renderPracticePanel() {
      const progressiveSession = state.currentQuestions.length > 0;
      const hasSession = progressiveSession || (!!state.currentVerb && state.currentForms.length > 0);
      const wrongCount = state.stats.wrongItems.length;
      const items = getPracticeItems();
      const scopeLabel = "全部 6 形";
      const kindLabel = getPracticeKindLabel(state.practiceKind);
      return `
        <section id="practice-panel" class="panel" role="tabpanel" aria-labelledby="view-practice-tab">
